---
# Gracefully shut down the entire k8s cluster (all nodes).
#
# kubelet's GracefulNodeShutdown (kubelet_shutdown_grace_period in
# inventory/group_vars/k8s_cluster/k8s-cluster.yml) caps every pod's grace
# period to a shared per-node budget, regardless of what the pod itself
# requests via terminationGracePeriodSeconds. Prometheus, for example, asks
# for 600s to flush its TSDB WAL but only gets ~90s from that budget — not
# enough, and the result has been corrupted WAL segments after a broadcast
# `shutdown -h now`.
#
# This playbook drains PVC-backed pods through the API first, while the
# whole cluster (and etcd quorum) is still healthy, giving each one its own
# real terminationGracePeriodSeconds via `kubectl delete pod --wait`. Only
# after that succeeds does it power off the nodes; kubelet's own grace
# period remains as a second line of defense for whatever's left (CNI,
# ingress, static content — nothing with unflushed on-disk state).
#
# Counterpart: run uncordon-k8s.yml after the nodes are back up — cordon
# state survives a reboot, so nothing will get scheduled until you do.

- name: Cordon nodes and gracefully drain PVC-backed pods
  hosts: localhost
  connection: local
  become: false
  tasks:
    - name: Cordon all kube nodes to prevent rescheduling during shutdown
      ansible.builtin.command: >
        kubectl --kubeconfig {{ ansible_env.HOME }}/.kube/k8s.yaml
        cordon {{ item }}
      loop: "{{ groups['kube'] }}"
      register: cordon_result
      changed_when: "'cordoned' in cordon_result.stdout"
      failed_when: cordon_result.rc != 0 and 'already cordoned' not in cordon_result.stderr

    - name: Get all pods as JSON
      ansible.builtin.command: >
        kubectl --kubeconfig {{ ansible_env.HOME }}/.kube/k8s.yaml
        get pods -A -o json
      register: all_pods_json
      changed_when: false

    # Not kubectl drain: PodDisruptionBudgets would block eviction here,
    # and for a full-cluster shutdown we want every PVC-backed pod to
    # terminate cleanly in place, not be blocked waiting for a healthy
    # replica to reschedule to (everything is going down anyway).
    - name: Start with an empty list of PVC-backed pods
      ansible.builtin.set_fact:
        pvc_pods: []

    - name: Collect running PVC-backed pods as namespace/name
      ansible.builtin.set_fact:
        pvc_pods: "{{ pvc_pods + [item.metadata.namespace ~ '/' ~ item.metadata.name] }}"
      loop: "{{ (all_pods_json.stdout | from_json)['items'] }}"
      loop_control:
        label: "{{ item.metadata.namespace }}/{{ item.metadata.name }}"
      when:
        - item.status.phase == "Running"
        - item.spec.volumes is defined
        - item.spec.volumes | selectattr('persistentVolumeClaim', 'defined') | list | length > 0

    # All pods are deleted at once, so the shutdown takes as long as the
    # slowest pod instead of the sum of all of them, and the CNPG primary
    # is not left missing for minutes while the others drain one by one
    # (the operator would see that as a reason to fail over). Each pod's
    # own terminationGracePeriodSeconds still applies. Per-pod elapsed
    # time is printed in completion order, so the slow pod is the last line.
    - name: Gracefully delete PVC-backed pods in parallel (each pod's own terminationGracePeriodSeconds applies, not the kubelet shutdown budget)
      ansible.builtin.shell: |
        for p in {{ pvc_pods | join(' ') }}; do
          (
            start=$SECONDS
            kubectl --kubeconfig {{ ansible_env.HOME }}/.kube/k8s.yaml \
              delete pod -n "${p%%/*}" "${p##*/}" --wait=true --timeout=300s >/dev/null 2>&1
            echo "$p rc=$? elapsed=$((SECONDS - start))s"
          ) &
        done
        wait
      args:
        executable: /bin/bash
      register: pod_delete
      changed_when: pvc_pods | length > 0
      failed_when: pod_delete.stdout_lines | reject('search', ' rc=0 ') | list | length > 0

    - name: Show how long each pod took to terminate
      ansible.builtin.debug:
        var: pod_delete.stdout_lines

- name: Power off all Kubernetes nodes
  hosts: kube
  become: true
  remote_user: "{{ ansible_ssh_user }}"
  tasks:
    - name: Shutdown node
      ansible.builtin.command: shutdown -h now
      async: 1
      poll: 0
      ignore_errors: true  # SSH connection drops as soon as shutdown is issued
