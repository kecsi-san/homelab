---
# Manual fallback companion to shutdown-k8s.yml. Nodes normally auto-uncordon on
# their own a few minutes after boot via the configure_k8s-auto-uncordon systemd
# timer (control-plane nodes, wired into post-k8s.yml). Use this playbook if you
# don't want to wait for the timer, or it failed and cordon state is stuck.

- name: Uncordon all kube nodes after cluster power-on
  hosts: localhost
  connection: local
  become: false
  tasks:
    - name: Wait for all nodes to report Ready
      ansible.builtin.command: >
        kubectl --kubeconfig {{ ansible_env.HOME }}/.kube/k8s.yaml
        wait --for=condition=Ready node/{{ item }} --timeout=300s
      loop: "{{ groups['kube'] }}"
      changed_when: false

    - name: Uncordon all kube nodes
      ansible.builtin.command: >
        kubectl --kubeconfig {{ ansible_env.HOME }}/.kube/k8s.yaml
        uncordon {{ item }}
      loop: "{{ groups['kube'] }}"
      register: uncordon_result
      changed_when: "'uncordoned' in uncordon_result.stdout"
