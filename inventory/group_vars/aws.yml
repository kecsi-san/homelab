---
# Variables for the [aws] group (EC2 edge node)
# SSH key path and AWS credentials are in secrets.yml (gitignored)

ansible_ssh_private_key_file: "{{ ec2_ssh_key_file }}"
ansible_python_interpreter: /usr/bin/python3

# Ansible hardcodes "-o KbdInteractiveAuthentication=no -o PreferredAuthentications=
# gssapi-with-mic,gssapi-keyex,hostbased,publickey" whenever no ansible_password is set
# (plugins/connection/ssh.py, added right before ssh_common_args/ssh_extra_args), and
# ssh honors the FIRST occurrence of a repeated -o key — so overriding via
# ansible_ssh_extra_args/ansible_ssh_common_args arrives too late to win.
# ansible_ssh_args (-> the "ssh_args" plugin option) is the one inserted earlier than
# that hardcoded block, so it's the only var that can actually override it. Since
# ansible_ssh_args fully replaces the default rather than appending, we repeat
# Ansible's own default ("-C -o ControlMaster=auto -o ControlPersist=60s") here too.
# This host requires keyboard-interactive for PAM-based Duo (configure_duo-ssh) as the
# second factor. With this override in place Ansible completes the Duo challenge itself
# (no PTY needed — Duo's autopush flow works fine non-interactively) on the first
# connection, then reuses it via its own ControlPersist=60s for the rest of the run.
# See roles/configure_duo-ssh/README.md.
ansible_ssh_args: >-
  -C -o ControlMaster=auto -o ControlPersist=60s
  -o PreferredAuthentications=publickey,keyboard-interactive
  -o KbdInteractiveAuthentication=yes

etckeeper: true
linuxbrew: false   # headless server, not a workstation

# --- System users, Apache vhosts/certs, Duo, AWS creds, mail ---
# Read live from Vault (see docs/howtos/vault-secrets-architecture.md and
# terraform/vault/README.md) rather than static values in secrets.yml. Every role
# still just reads {{ ec2_users }} etc. as before — only the source changed.
# vault_ansible_role_id / vault_ansible_secret_id (AppRole auth for this lookup)
# still live in secrets.yml (gitignored) — see secrets.yml.example.
#
# ROLLOUT SAFETY: the pre-migration values also still exist in secrets.yml as a
# manual fallback. Don't remove them until `ansible-playbook -i inventory/aws_hosts
# playbooks/ec2-core.yml --check` confirms every one of these resolves correctly
# from Vault. Removing the fallback is a separate, later cleanup step.
#
# Key layout below mirrors terraform/vault/README.md's bootstrap step 4 grouping
# (ec2/aws-creds, ec2/duo, ec2/users, ec2/vhosts, ec2/mail) — adjust the paths/keys
# here if you land on a different grouping when you actually migrate the data.
vault_ec2_lookup_args:
  url: "{{ vault_api_addr | default('https://vault.kecskemethy.hu') }}"
  engine_mount_point: ec2
  auth_method: approle
  role_id: "{{ vault_ansible_role_id }}"
  secret_id: "{{ vault_ansible_secret_id }}"

aws_access_key_id: "{{ lookup('community.hashi_vault.vault_kv2_get', 'aws-creds', **vault_ec2_lookup_args)['secret']['aws_access_key_id'] }}"
aws_secret_access_key: "{{ lookup('community.hashi_vault.vault_kv2_get', 'aws-creds', **vault_ec2_lookup_args)['secret']['aws_secret_access_key'] }}"

duo_ikey: "{{ lookup('community.hashi_vault.vault_kv2_get', 'duo', **vault_ec2_lookup_args)['secret']['duo_ikey'] }}"
duo_skey: "{{ lookup('community.hashi_vault.vault_kv2_get', 'duo', **vault_ec2_lookup_args)['secret']['duo_skey'] }}"
duo_api_host: "{{ lookup('community.hashi_vault.vault_kv2_get', 'duo', **vault_ec2_lookup_args)['secret']['duo_api_host'] }}"

ec2_users: "{{ lookup('community.hashi_vault.vault_kv2_get', 'users', **vault_ec2_lookup_args)['secret']['ec2_users'] }}"
ec2_users_absent: "{{ lookup('community.hashi_vault.vault_kv2_get', 'users', **vault_ec2_lookup_args)['secret']['ec2_users_absent'] }}"

apache_server_admin: "{{ lookup('community.hashi_vault.vault_kv2_get', 'vhosts', **vault_ec2_lookup_args)['secret']['apache_server_admin'] }}"
apache_certs: "{{ lookup('community.hashi_vault.vault_kv2_get', 'vhosts', **vault_ec2_lookup_args)['secret']['apache_certs'] }}"
apache_vhosts: "{{ lookup('community.hashi_vault.vault_kv2_get', 'vhosts', **vault_ec2_lookup_args)['secret']['apache_vhosts'] }}"

mailbox_users: "{{ lookup('community.hashi_vault.vault_kv2_get', 'mail', **vault_ec2_lookup_args)['secret']['mailbox_users'] }}"
email_domains: "{{ lookup('community.hashi_vault.vault_kv2_get', 'mail', **vault_ec2_lookup_args)['secret']['email_domains'] }}"
mail_cert_name: linuxbox.hu

# --- HashiCorp Vault ---
# vault_version: leave empty to install latest from HashiCorp APT repo.
# Pin after first install to prevent unintended upgrades — apt-mark hold is applied automatically when set.
# Data migration from old server: rsync /opt/hashicorp/vault-data/ → /opt/vault/data/
# Files are owned vault:vault on both old and new server — no chown needed after rsync.
vault_version: ""
