---
# Homepage values — k3s local dev cluster
image:
  tag: v1.13.1

enableRbac: true

serviceAccount:
  name: homepage
  create: true

env:
  HOMEPAGE_ALLOWED_HOSTS: homepage.k3s.kecskemethy.org

ingress:
  main:
    enabled: false  # using Traefik IngressRoute instead

config:
  kubernetes:
    mode: cluster

  settings:
    title: Homepage - k3s local dev cluster
    allowedHosts: homepage.k3s.kecskemethy.org
    theme: dark
    color: slate
    headerStyle: clean
    layout:
      Kubernetes:
        style: row
        columns: 3
      Platform:
        style: row
        columns: 3

  widgets:
    - greeting:
        text: k3s local dev cluster
    - datetime:
        text_size: xl
        format:
          dateStyle: short
          timeStyle: short
          hour12: false
    - resources:
        cpu: true
        memory: true
        disk: /
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: k3s
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  services:
    - Kubernetes:
        - ArgoCD:
            href: https://argocd.k3s.kecskemethy.org
            description: GitOps continuous delivery
            icon: argo-cd.png
            namespace: argocd
            app: argocd-server
        - Headlamp:
            href: https://headlamp.k3s.kecskemethy.org
            description: Kubernetes dashboard
            icon: headlamp.png
            namespace: kube-system
            app: headlamp
        - Traefik:
            href: https://traefik.k3s.kecskemethy.org/dashboard/
            description: Ingress controller
            icon: traefik.png
            namespace: traefik
            app: traefik
    - Platform:
        - Forgejo:
            href: https://forgejo.k3s.kecskemethy.org
            description: Git server · OCI registry · CI
            icon: forgejo.png
            namespace: forgejo
            app: forgejo
        - Authentik:
            href: https://authentik.k3s.kecskemethy.org
            description: Identity provider · SSO
            icon: authentik.png
            namespace: authentik
            app: authentik
        - Wiki.js:
            href: https://wiki.k3s.kecskemethy.org
            description: Documentation wiki
            icon: wikijs.png
            namespace: wikijs
            app: wiki
