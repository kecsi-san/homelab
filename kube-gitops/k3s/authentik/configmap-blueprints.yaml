---
apiVersion: v1
kind: ConfigMap
metadata:
  name: authentik-blueprints
  namespace: authentik
data:
  aaa-groups.yaml: |
    version: 1
    metadata:
      name: Homelab Groups and Scope Mappings
      labels:
        blueprints.goauthentik.io/description: Shared groups and OAuth2 scope mappings used across providers
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_core.group
        state: present
        identifiers:
          name: homelab-admins
        attrs:
          name: homelab-admins
          users:
            - !Find [authentik_core.user, [username, kecsi]]

      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          name: Groups
        attrs:
          name: Groups
          scope_name: groups
          expression: |
            return {
                "groups": [g.name for g in request.user.ak_groups.all()]
            }

  forgejo.yaml: |
    version: 1
    metadata:
      name: Forgejo OAuth2 Application
      labels:
        blueprints.goauthentik.io/description: Forgejo Git server OAuth2 integration (k3s)
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Forgejo-k3s
        attrs:
          name: Forgejo-k3s
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: forgejo-k3s
          client_secret: !Env FORGEJO_OAUTH2_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://forgejo.k3s.kecskemethy.org/user/oauth2/authentik/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
          grant_types:
            - authorization_code
            - refresh_token
          sub_mode: user_username
          issuer_mode: per_provider
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: forgejo-k3s
        attrs:
          name: Forgejo (k3s)
          slug: forgejo-k3s
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Forgejo-k3s]]
          meta_description: Git server · k3s
          policy_engine_mode: any

  argocd-k3s.yaml: |
    version: 1
    metadata:
      name: ArgoCD OAuth2 Application (k3s)
      labels:
        blueprints.goauthentik.io/description: ArgoCD GitOps controller OIDC integration (k3s)
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: ArgoCD-k3s
        attrs:
          name: ArgoCD-k3s
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: argocd-k3s
          client_secret: !Env ARGOCD_OAUTH2_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://argocd.k3s.kecskemethy.org/auth/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
            - !Find [authentik_providers_oauth2.scopemapping, [name, "Groups"]]
          grant_types:
            - authorization_code
            - refresh_token
          sub_mode: user_username
          issuer_mode: per_provider
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: argocd-k3s
        attrs:
          name: ArgoCD (k3s)
          slug: argocd-k3s
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, ArgoCD-k3s]]
          meta_description: GitOps continuous delivery · k3s
          policy_engine_mode: any

  wikijs-k3s.yaml: |
    version: 1
    metadata:
      name: Wiki.js OAuth2 Application (k3s)
      labels:
        blueprints.goauthentik.io/description: Wiki.js OIDC integration (k3s)
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Wikijs-k3s
        attrs:
          name: Wikijs-k3s
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          client_id: wikijs-k3s
          client_secret: !Env WIKIJS_OAUTH2_CLIENT_SECRET
          redirect_uris:
            - matching_mode: strict
              url: https://wiki.k3s.kecskemethy.org/login/394c8518-0693-47c0-8bcc-b25f31d6f2e7/callback
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-openid"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-profile"]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, "goauthentik.io/providers/oauth2/scope-email"]]
          grant_types:
            - authorization_code
            - refresh_token
          sub_mode: user_username
          issuer_mode: per_provider
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]

      - model: authentik_core.application
        state: present
        identifiers:
          slug: wikijs-k3s
        attrs:
          name: Wiki.js (k3s)
          slug: wikijs-k3s
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Wikijs-k3s]]
          meta_description: Wiki · documentation · k3s
          policy_engine_mode: any
