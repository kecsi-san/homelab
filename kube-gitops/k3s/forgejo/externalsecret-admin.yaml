---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin-credentials
  namespace: forgejo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: forgejo-admin-credentials
  data:
    - secretKey: email
      remoteRef:
        key: k3s/forgejo/admin-credentials
        property: email
    - secretKey: password
      remoteRef:
        key: k3s/forgejo/admin-credentials
        property: password
    - secretKey: username
      remoteRef:
        key: k3s/forgejo/admin-credentials
        property: username
