---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kromgo
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/target: "9fa18953-8d82-424d-a8b5-9941940d4230.cfargotunnel.com"
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`kromgo.kecskemethy.org`) && Path(`/favicon.ico`)
      kind: Rule
      priority: 20
      services:
        - name: kromgo
          port: 8081
    - match: Host(`kromgo.kecskemethy.org`)
      kind: Rule
      priority: 10
      services:
        - name: kromgo
          port: 8080
  tls:
    secretName: kromgo-tls
