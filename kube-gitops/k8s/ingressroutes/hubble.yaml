---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: hubble
  namespace: kube-system
  # No external-dns annotation — LAN only, not exposed via Cloudflare Tunnel
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`hubble.kecskemethy.org`)
      kind: Rule
      priority: 10
      services:
        - name: hubble-ui
          port: 80
  tls:
    secretName: hubble-tls
