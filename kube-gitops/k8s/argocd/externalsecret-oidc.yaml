---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc-secret
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: argocd-oidc-secret
    template:
      metadata:
        # required or ArgoCD silently ignores this secret when referenced
        # from argocd-cm ($argocd-oidc-secret:client-secret)
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: client-secret
      remoteRef:
        key: k8s/oauth2/argocd
        property: client-secret
