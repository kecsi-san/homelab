---
# Homepage values — k8s homelab dashboard
image:
  # repository pinned so Renovate's helm-values manager can resolve and
  # track this tag (it needs both fields present to build the image ref)
  repository: ghcr.io/gethomepage/homepage
  tag: v2.1.2

enableRbac: true

serviceAccount:
  name: homepage
  create: true

env:
  HOMEPAGE_ALLOWED_HOSTS: homepage.kecskemethy.org

ingress:
  main:
    enabled: false  # using Traefik IngressRoute instead

config:
  kubernetes:
    mode: cluster

  settings:
    title: Homepage - k8s homelab dashboard
    allowedHosts: homepage.kecskemethy.org
    theme: dark
    color: slate
    headerStyle: clean
    background:
      image: https://raw.githubusercontent.com/kecsi-san/homelab/main/kube-gitops/k8s/homepage/moon-space-art-bg.jpg

      saturate: 50
      brightness: 50
      opacity: 50
    layout:
      Kubernetes:
        style: row
        columns: 3
      Monitoring:
        style: row
        columns: 3
      Apps:
        style: row
        columns: 3
      Platform:
        style: row
        columns: 3

  widgets:
    - greeting:
        text: k8s homelab dashboard
    - datetime:
        text_size: xl
        format:
          dateStyle: short
          timeStyle: short
          hour12: false
    - resources:
        cpu: true
        memory: true
        disk: /
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: k8s
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true

  services:
    - Kubernetes:
        - ArgoCD:
            href: https://argocd.kecskemethy.org
            description: GitOps continuous delivery
            icon: argo-cd.png
            namespace: argocd
            app: argocd-server
        - Headlamp:
            href: https://headlamp.kecskemethy.org
            description: Kubernetes dashboard
            icon: headlamp.png
            namespace: kube-system
            app: headlamp
        - Longhorn:
            href: https://longhorn.kecskemethy.org
            description: Distributed block storage — LAN only
            icon: longhorn.png
            namespace: longhorn-system
            app: longhorn
        - Traefik:
            href: https://traefik.kecskemethy.org/dashboard/
            description: Ingress controller — LAN only
            icon: traefik.png
            namespace: traefik
            app: traefik
    - Monitoring:
        - Grafana:
            href: https://grafana.kecskemethy.org
            description: Metrics and dashboards
            icon: grafana.png
            namespace: monitoring
            app: grafana
        - Gatus:
            href: https://gatus.kecskemethy.org
            description: Uptime monitoring
            icon: gatus.png
            namespace: gatus
            app: gatus
        - ntfy:
            href: https://ntfy.kecskemethy.org
            description: Push notifications
            icon: ntfy.png
            namespace: ntfy
            app: ntfy
        - Kromgo:
            href: https://kromgo.kecskemethy.org
            description: Cluster metric badges
            icon: prometheus.png
            namespace: monitoring
            app: kromgo
        - Hubble:
            href: https://hubble.kecskemethy.org
            description: Cilium network observability — LAN only
            icon: cilium.png
            namespace: kube-system
            app: hubble-ui
    - Apps:
        - OpenCloud:
            href: https://opencloud.kecskemethy.org
            description: Cloud file storage and sharing (trial)
            icon: open-cloud.png
            namespace: opencloud
            app: opencloud
        - Mealie:
            href: https://mealie.kecskemethy.org
            description: Recipe manager
            icon: mealie.png
            namespace: mealie
            app: mealie
        - Glance:
            href: https://glance.kecskemethy.org
            description: Personal feed dashboard
            icon: https://raw.githubusercontent.com/glanceapp/glance/main/docs/logo.png
            namespace: glance
            app: glance
        - Minecraft:
            description: Bedrock server · 192.168.1.110:19132
            icon: minecraft.png
            namespace: minecraft
            app: minecraft-bedrock
    - Platform:
        - Forgejo:
            href: https://forgejo.kecskemethy.org
            description: Git server · OCI registry · CI
            icon: forgejo.png
            namespace: forgejo
            app: forgejo
        - Authentik:
            href: https://authentik.kecskemethy.org
            description: Identity provider · SSO
            icon: authentik.png
            namespace: authentik
            app: authentik
        - Wiki.js:
            href: https://wiki.kecskemethy.org
            description: Wiki · documentation
            icon: wikijs.png
            namespace: wikijs
            app: wiki
        - Backstage:
            href: https://backstage.kecskemethy.org
            description: Developer portal · service catalog
            icon: si-backstage
            namespace: backstage
            app: backstage
        - Vault:
            href: https://vault.kecskemethy.hu
            description: Secrets management · EC2 edge node
            icon: vault.png
