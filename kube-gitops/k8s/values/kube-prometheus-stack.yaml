---
# kube-prometheus-stack values — k8s bare-metal cluster
# Grafana is disabled here; deployed separately via grafana-operator (monitoring-config app).

grafana:
  enabled: false

# Debian prometheus-node-exporter package is already running on port 9100
# on all nodes (installed by Ansible setup_minimal role). Disable the KPS
# DaemonSet to avoid port conflicts; scrape the existing one directly.
nodeExporter:
  enabled: false

# kube-proxy replaced by Cilium in this cluster
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: "45GB"
    scrapeInterval: "30s"
    evaluationInterval: "30s"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi
    additionalScrapeConfigs:
      - job_name: node-exporter
        static_configs:
          - targets: ["192.168.1.18:9100"]
            labels: {nodename: hped800g5}
          - targets: ["192.168.1.34:9100"]
            labels: {nodename: hped800g62}
          - targets: ["192.168.1.36:9100"]
            labels: {nodename: hped800g61}
          - targets: ["192.168.1.52:9100"]
            labels: {nodename: hppd600g6}

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: ntfy
      routes:
        - matchers:
            - alertname = Watchdog
          receiver: "null"
        - matchers:
            - alertname = InfoInhibitor
          receiver: "null"
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url: "http://ntfy-alertmanager.ntfy.svc.cluster.local:9095/alert"
            send_resolved: true
            max_alerts: 10
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
