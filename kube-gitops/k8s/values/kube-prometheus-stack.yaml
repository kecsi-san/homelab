---
# kube-prometheus-stack values — k8s bare-metal cluster
# Grafana is disabled here; deployed separately via grafana-operator (monitoring-config app).

grafana:
  enabled: false

# Debian prometheus-node-exporter package is already running on port 9100
# on all nodes (installed by Ansible setup_minimal role). Disable the KPS
# DaemonSet to avoid port conflicts; scrape the existing one directly.
nodeExporter:
  enabled: false

# kube-proxy replaced by Cilium in this cluster
kubeProxy:
  enabled: false

# apiserver's default histogram buckets alone were ~98K of the TSDB's ~180K
# active series (more than half the cluster's total cardinality) for latency
# percentiles nobody queries in this homelab. Keep scraping it (kromgo's
# kubernetes_version badge needs kubernetes_build_info from this target) but
# drop everything else via metricRelabelings.
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
      - action: keep
        regex: kubernetes_build_info
        sourceLabels: [__name__]

# etcd/controller-manager/scheduler metrics aren't used by any dashboard or
# kromgo badge here; disabling also removes controller-manager/scheduler as
# a source of the old TargetDown alert blips (see TODO.md).
kubeEtcd:
  enabled: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

prometheus:
  prometheusSpec:
    # Discover ServiceMonitors and PodMonitors from all namespaces.
    # serviceMonitorSelectorNilUsesHelmValues must be false; otherwise KPS
    # overrides any empty selector back to {matchLabels: {release: kube-prometheus-stack}}.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    podMonitorNamespaceSelector: {}
    retention: 15d
    retentionSize: "10GB"
    scrapeInterval: "30s"
    evaluationInterval: "30s"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 15Gi
    additionalScrapeConfigs:
      - job_name: node-exporter
        static_configs:
          - targets: ["192.168.1.18:9100"]
            labels: {nodename: hped800g5}
          - targets: ["192.168.1.34:9100"]
            labels: {nodename: hped800g62}
          - targets: ["192.168.1.36:9100"]
            labels: {nodename: hped800g61}
          - targets: ["192.168.1.52:9100"]
            labels: {nodename: hppd600g6}

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: ntfy
      routes:
        - matchers:
            - alertname = Watchdog
          receiver: "null"
        - matchers:
            - alertname = InfoInhibitor
          receiver: "null"
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url: "http://ntfy-alertmanager.ntfy.svc.cluster.local:9095/alert"
            send_resolved: true
            max_alerts: 10
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname
