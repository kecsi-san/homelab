---
# kube-prometheus-stack values — k8s bare-metal cluster
# Grafana is disabled here; deployed separately via grafana-operator (monitoring-config app).

grafana:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 15d
    retentionSize: "45GB"
    scrapeInterval: "30s"
    evaluationInterval: "30s"
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 50Gi

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: "null"
    receivers:
      - name: "null"
    inhibit_rules:
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ warning|info
        equal:
          - namespace
          - alertname

# kube-proxy replaced by Cilium in this cluster
kubeProxy:
  enabled: false
