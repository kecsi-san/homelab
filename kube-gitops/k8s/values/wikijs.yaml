---
# Wiki.js v2 — external PostgreSQL (CNPG), no bundled postgres
# chart v3.0.0 renamed the external-DB values block: postgresql.* (with
# enabled: false) no longer renders any DB_* env vars — externalPostgresql.*
# is required instead (postgresqlHost -> host, postgresqlPort -> port, etc.)
postgresql:
  enabled: false

externalPostgresql:
  host: postgres-rw.postgres.svc.cluster.local
  port: 5432
  database: wikijs
  username: wikijs
  existingSecret: wikijs-app
  existingSecretKey: postgresql-password

ingress:
  enabled: false

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    memory: 256Mi
    cpu: 50m
  limits:
    memory: 512Mi
    cpu: "1"

# Mount patched passport-openidconnect session state store that calls
# req.session.save() explicitly so the OIDC state survives the redirect.
volumes:
  - name: session-fix
    configMap:
      name: wikijs-session-fix

volumeMounts:
  - name: session-fix
    mountPath: /wiki/node_modules/passport-openidconnect/lib/state/session.js
    subPath: session.js
