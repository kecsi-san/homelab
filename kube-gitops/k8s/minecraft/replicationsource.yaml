---
apiVersion: volsync.backube/v1alpha1
kind: ReplicationSource
metadata:
  name: minecraft-backup
  namespace: minecraft
spec:
  sourcePVC: minecraft-data
  trigger:
    schedule: "0 5 * * 0"
  restic:
    pruneIntervalDays: 14
    repository: volsync-restic-secret
    retain:
      weekly: 4
      monthly: 3
    copyMethod: Clone
    storageClassName: longhorn
    accessModes: [ReadWriteOnce]
    moverSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      # restic 0.19 aborts when it cannot write its cache, and the cache volume is root-owned;
      # fsGroup makes it group-writable for the mover (found 2026-11-15, the manual trigger had hidden it)
      fsGroup: 1000
