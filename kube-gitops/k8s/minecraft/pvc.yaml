---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-data
  namespace: minecraft
  labels:
    # Opt in to the VolSync clone snapshot retention job (kube-gitops/k8s/volsync-config)
    recurring-job.longhorn.io/source: enabled
    recurring-job-group.longhorn.io/volsync-clone-source: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
