---
# Temporary debug patch — patches OIDC authentication.js to log profile data and
# any processProfile errors to stdout so they appear in `kubectl logs`.
# Remove once OIDC login is working.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wikijs-oidc-debug
  namespace: wikijs
data:
  authentication.js: |
    const _ = require('lodash')

    /* global WIKI */

    // ------------------------------------
    // OpenID Connect Account
    // ------------------------------------

    const OpenIDConnectStrategy = require('passport-openidconnect').Strategy

    module.exports = {
      init (passport, conf) {
        passport.use(conf.key,
          new OpenIDConnectStrategy({
            authorizationURL: conf.authorizationURL,
            tokenURL: conf.tokenURL,
            clientID: conf.clientId,
            clientSecret: conf.clientSecret,
            issuer: conf.issuer,
            userInfoURL: conf.userInfoURL,
            callbackURL: conf.callbackURL,
            passReqToCallback: true,
            skipUserProfile: conf.skipUserProfile,
            acrValues: conf.acrValues
          }, async (req, iss, uiProfile, idProfile, context, idToken, accessToken, refreshToken, params, cb) => {
            const profile = Object.assign({}, idProfile, uiProfile)
            const picture = _.get(profile, '_json.' + conf.pictureClaim, '')

            console.log('[OIDC-DEBUG] callback fired, profile.id=' + profile.id +
              ' profile.email=' + profile.email +
              ' _json.email=' + _.get(profile, '_json.email') +
              ' providerKey=' + req.params.strategy)

            try {
              const user = await WIKI.models.users.processProfile({
                providerKey: req.params.strategy,
                profile: {
                  ...profile,
                  email: _.get(profile, '_json.' + conf.emailClaim),
                  displayName: _.get(profile, '_json.' + conf.displayNameClaim, ''),
                  picture: picture
                }
              })
              console.log('[OIDC-DEBUG] processProfile succeeded, user.id=' + user.id + ' user.email=' + user.email)
              if (conf.mapGroups) {
                const groups = _.get(profile, '_json.' + conf.groupsClaim)
                if (groups && _.isArray(groups)) {
                  const currentGroups = (await user.$relatedQuery('groups').select('groups.id')).map(g => g.id)
                  const expectedGroups = Object.values(WIKI.auth.groups).filter(g => groups.includes(g.name)).map(g => g.id)
                  for (const groupId of _.difference(expectedGroups, currentGroups)) {
                    await user.$relatedQuery('groups').relate(groupId)
                  }
                  for (const groupId of _.difference(currentGroups, expectedGroups)) {
                    await user.$relatedQuery('groups').unrelate().where('groupId', groupId)
                  }
                }
              }
              cb(null, user)
            } catch (err) {
              console.error('[OIDC-DEBUG] processProfile FAILED: ' + err.message)
              console.error('[OIDC-DEBUG] stack: ' + err.stack)
              cb(err, null)
            }
          })
        )
      },
      logout (conf) {
        if (!conf.logoutURL) {
          return '/'
        } else {
          return conf.logoutURL
        }
      }
    }
