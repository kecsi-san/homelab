---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: wikijs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.js.wiki
      chart: wiki
      targetRevision: "3.0.0"
      helm:
        valueFiles:
          - $values/kube-gitops/k8s/values/wikijs.yaml
    - repoURL: https://github.com/kecsi-san/homelab.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/kecsi-san/homelab.git
      targetRevision: HEAD
      path: kube-gitops/k8s/wikijs
  destination:
    server: https://kubernetes.default.svc
    namespace: wikijs
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jqPathExpressions:
        - .spec.template.metadata.annotations."kubectl.kubernetes.io/restartedAt"
        # deployment.kubernetes.io/revision is written by the Deployment
        # controller on every rollout, not by us — never present in the
        # git manifest, so it perpetually shows the Deployment OutOfSync.
        - .metadata.annotations."deployment.kubernetes.io/revision"
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
