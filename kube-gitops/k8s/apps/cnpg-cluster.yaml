---
# Deploy after the cnpg operator app is Healthy — CNPG CRDs must exist first.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-cluster
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/kecsi-san/homelab.git
    targetRevision: HEAD
    path: kube-gitops/k8s/cnpg
  destination:
    server: https://kubernetes.default.svc
    namespace: postgres
  ignoreDifferences:
    - group: postgresql.cnpg.io
      kind: Cluster
      jsonPointers:
        - /metadata/labels/app.kubernetes.io~1instance
        # cnpg.io/reconciliationLoop is a nonce the CNPG operator rewrites on
        # its own reconcile cadence (unrelated to our spec) — without this,
        # ArgoCD flags the Cluster OutOfSync every time the operator ticks.
        - /metadata/annotations/cnpg.io~1reconciliationLoop

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
