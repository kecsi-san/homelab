        attrs:
          name: Longhorn
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          mode: forward_single
          external_host: https://longhorn.kecskemethy.org/

      - model: authentik_core.application
        state: present
        identifiers:
          slug: longhorn
        attrs:
          name: Longhorn
          slug: longhorn
          provider: !Find [authentik_providers_proxy.proxyprovider, [name, Longhorn]]
          meta_description: Distributed block storage dashboard
