---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kromgo
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kromgo
  template:
    metadata:
      labels:
        app: kromgo
        app.kubernetes.io/name: kromgo
      annotations:
        reloader.stakater.com/auto: "true"
    spec:
      containers:
        - name: kromgo
          image: ghcr.io/home-operations/kromgo:0.12.0
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PROMETHEUS_URL
              value: http://prometheus-operated.monitoring.svc.cluster.local:9090
          volumeMounts:
            - name: config
              mountPath: /config/config.yaml
              subPath: config.yaml
          readinessProbe:
            httpGet:
              path: /badges/cluster_cpu_usage
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              memory: 32Mi
              cpu: 10m
            limits:
              memory: 64Mi
              cpu: 100m
        - name: favicon
          image: nginx:1.29-alpine
          ports:
            - name: favicon
              containerPort: 8081
          volumeMounts:
            - name: favicon-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: favicon-config
              mountPath: /usr/share/nginx/html/favicon.ico
              subPath: favicon.ico
          resources:
            requests:
              memory: 16Mi
              cpu: 10m
            limits:
              memory: 32Mi
              cpu: 50m
      volumes:
        - name: config
          configMap:
            name: kromgo-config
        - name: favicon-config
          configMap:
            name: kromgo-favicon
---
apiVersion: v1
kind: Service
metadata:
  name: kromgo
  namespace: monitoring
spec:
  selector:
    app: kromgo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
    - name: favicon
      port: 8081
      targetPort: 8081
