---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kromgo-favicon
  namespace: monitoring
data:
  default.conf: |
    server {
        listen 8081;
        location = /favicon.ico {
            root /usr/share/nginx/html;
            default_type image/png;
        }
    }
binaryData:
  # yamllint disable-line rule:line-length
  favicon.ico: 
