---
# Grafana instance managed by grafana-operator.
# OAuth2 secret (grafana-oauth2-secret) must be sealed and committed separately:
#   kubectl create secret generic grafana-oauth2-secret --namespace monitoring \
#     --from-literal=client-secret=<generated-value> --dry-run=client -o yaml | \
#     kubeseal --format yaml --context "admin@k8s" \
#       --controller-name sealed-secrets --controller-namespace sealed-secrets \
#     > kube-gitops/k8s/monitoring/sealedsecret-grafana-oauth2.yaml
# Until the secret exists, Grafana starts without OAuth2 (local admin login still works).
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: monitoring
  labels:
    dashboards: "grafana"
spec:
  config:
    log:
      mode: console
    auth:
      disable_login_form: "false"
    auth.generic_oauth:
      enabled: "true"
      name: Authentik
      allow_sign_up: "true"
      client_id: grafana
      scopes: "openid profile email groups"
      auth_url: "https://authentik.kecskemethy.org/application/o/authorize/"
      token_url: "https://authentik.kecskemethy.org/application/o/token/"
      api_url: "https://authentik.kecskemethy.org/application/o/userinfo/"
      role_attribute_path: "contains(groups[*], 'homelab-admins') && 'Admin' || 'Viewer'"
      role_attribute_strict: "false"
      allow_assign_grafana_admin: "true"
    server:
      root_url: "https://grafana.kecskemethy.org"
  deployment:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: grafana
        spec:
          containers:
            - name: grafana
              env:
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oauth2-secret
                      key: client-secret
                      optional: true
  persistentVolumeClaim:
    spec:
      storageClassName: longhorn
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
  service:
    spec:
      type: ClusterIP
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: prometheus
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  datasource:
    name: Prometheus
    type: prometheus
    url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
    access: proxy
    isDefault: true
    jsonData:
      timeInterval: "30s"
      httpMethod: POST
