---
# Node Exporter Full — per-node CPU, RAM, disk, network metrics (use instance variable to select node)
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: node-exporter-full
  namespace: monitoring
spec:
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  grafanaCom:
    id: 1860
    revision: 37
---
