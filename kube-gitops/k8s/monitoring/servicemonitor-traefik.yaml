---
# Traefik metrics — chart ServiceMonitor has label selector mismatch (traefik-traefik vs traefik).
# Disabled chart SM; this raw one targets the actual labels on traefik-metrics service.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: traefik
spec:
  endpoints:
    - path: /metrics
      targetPort: metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - traefik
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
      app.kubernetes.io/name: traefik
