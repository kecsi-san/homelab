---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-secrets
  namespace: garage
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-homelab
    kind: ClusterSecretStore
  target:
    name: garage-secrets
  data:
    - secretKey: admin-token
      remoteRef:
        key: k8s/garage/secrets
        property: admin-token
    - secretKey: rpc-secret
      remoteRef:
        key: k8s/garage/secrets
        property: rpc-secret
