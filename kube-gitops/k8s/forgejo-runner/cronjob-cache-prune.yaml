---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forgejo-runner-cache-prune
  namespace: forgejo-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: forgejo-runner-cache-prune
  namespace: forgejo-runner
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: forgejo-runner-cache-prune
  namespace: forgejo-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: forgejo-runner-cache-prune
subjects:
  - kind: ServiceAccount
    name: forgejo-runner-cache-prune
    namespace: forgejo-runner
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: forgejo-runner-cache-prune
  namespace: forgejo-runner
spec:
  schedule: "0 4 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: forgejo-runner-cache-prune
        spec:
          serviceAccountName: forgejo-runner-cache-prune
          restartPolicy: OnFailure
          containers:
            - name: kubectl
              image: bitnami/kubectl:latest
              command:
                - /bin/sh
                - -c
                - |
                  kubectl exec -n forgejo-runner deploy/forgejo-runner -c runner -- \
                    sh -c "rm -rf /data/.cache/act/* /data/cache/cache/* /data/cache/bolt.db"
                  kubectl rollout restart deployment/forgejo-runner -n forgejo-runner
              resources:
                requests:
                  memory: 32Mi
                  cpu: 10m
                limits:
                  memory: 64Mi
                  cpu: 100m
