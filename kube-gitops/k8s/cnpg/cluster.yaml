---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
  namespace: postgres
spec:
  instances: 2

  imageName: ghcr.io/cloudnative-pg/postgresql:17

  # Default is 1800s (30min) — observed shutdowns take ~30s per instance in practice
  # (see kubelet nodeshutdown_manager logs), 600s gives ample headroom for a homelab-scale
  # cluster (a few small databases) while matching kubelet_shutdown_grace_period.
  stopDelay: 600

  # Default 0 promotes a replica the instant the primary looks unhealthy. During this
  # homelab's routine simultaneous multi-node cold boot the primary is always briefly
  # unhealthy (Longhorn attach + crash recovery), so every boot minted 1-2 spurious
  # promotions (12 timelines in 11 weeks) and left the demoted old primary wedged on a
  # stale timeline (Refusing to restore future timeline history file). 300s lets a
  # primary that is merely slow to boot stay primary. Trade-off: a genuine primary
  # failure takes up to 300s longer to fail over. Revisit if cold boots still promote.
  failoverDelay: 300

  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: 256MB
      # Cap on WAL a stuck/inactive replication slot can pin on the primary.
      # Without it (default -1) one wedged replica retains WAL indefinitely and
      # fills the PVC (2026-08-08, 2026-08-17, 2026-10-25: 1.8GB pinned on a 6Gi
      # volume). On breach Postgres invalidates the slot, the primary stays up
      # and only that replica needs a rebuild. Reload-only, no restart.
      max_slot_wal_keep_size: 2GB

  bootstrap:
    initdb:
      database: forgejo
      owner: forgejo
      secret:
        name: forgejo-db-credentials

  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: authentik-db-credentials
      - name: wikijs
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: wikijs-db-credentials
      - name: backstage
        ensure: present
        login: true
        inherit: true
        connectionLimit: -1
        passwordSecret:
          name: backstage-db-credentials

  storage:
    storageClass: longhorn
    size: 6Gi

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 1Gi
      cpu: "1"
