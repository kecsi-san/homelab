---
- name: Fail early when MaxMind credentials are missing
  ansible.builtin.assert:
    that:
      - geoip_maxmind_account_id | string | length > 0
      - geoip_maxmind_license_key | string | length > 0
      - geoip_maxmind_account_id != 'CHANGE_ME'
      - geoip_maxmind_license_key != 'CHANGE_ME'
    fail_msg: >-
      geoip_maxmind_account_id / geoip_maxmind_license_key are empty or still the
      CHANGE_ME placeholder. Set the real values in Vault first (see roles/setup_geoip/README.md, "Vault entry").
    quiet: true
  tags: [geoip]

# geoipupdate is in Debian's contrib component; the official cloud images enable only main.
- name: Check for the deb822 Debian sources file
  ansible.builtin.stat:
    path: /etc/apt/sources.list.d/debian.sources
  register: geoip_debian_sources
  when: geoip_enable_contrib | bool
  tags: [geoip]

- name: Enable the contrib component
  ansible.builtin.replace:
    path: /etc/apt/sources.list.d/debian.sources
    regexp: '^Components: main$'
    replace: 'Components: main contrib'
  become: true
  register: geoip_contrib
  when:
    - geoip_enable_contrib | bool
    - geoip_debian_sources.stat.exists
  tags: [geoip]

# apt_cache validity below would otherwise skip the refresh and the package stays unknown.
- name: Refresh the apt cache after enabling contrib
  ansible.builtin.apt:
    update_cache: true
  become: true
  when: geoip_contrib is changed
  tags: [geoip]

- name: Install GeoIP packages
  ansible.builtin.apt:
    name: "{{ geoip_apt_packages + [geoip_kernel_headers_package] }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true
  tags: [geoip]

# Debian 13's xtables-addons-common does not create this directory. The build unit's
# ReadWritePaths= needs it to exist, otherwise systemd fails with status 226/NAMESPACE.
- name: Create the xt_geoip data directory
  ansible.builtin.file:
    path: "{{ geoip_xt_geoip_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [geoip]

- name: Write /etc/GeoIP.conf
  ansible.builtin.template:
    src: GeoIP.conf.j2
    dest: /etc/GeoIP.conf
    owner: root
    group: root
    mode: "0600"
  become: true
  no_log: true
  tags: [geoip]

- name: Install xt-geoip-build
  ansible.builtin.copy:
    src: xt-geoip-build
    dest: /usr/local/sbin/xt-geoip-build
    owner: root
    group: root
    mode: "0755"
  become: true
  notify: Rebuild xt_geoip files
  tags: [geoip]

- name: Install xt-geoip-build systemd unit
  ansible.builtin.copy:
    src: xt-geoip-build.service
    dest: /etc/systemd/system/xt-geoip-build.service
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd
  tags: [geoip]

- name: Create geoipupdate.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/geoipupdate.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  tags: [geoip]

- name: Chain xt-geoip-build after geoipupdate (OnSuccess=)
  ansible.builtin.copy:
    src: geoipupdate-xt-geoip.conf
    dest: /etc/systemd/system/geoipupdate.service.d/xt-geoip.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload systemd
  tags: [geoip]

- name: Flush handlers so systemd knows the new units before they are used
  ansible.builtin.meta: flush_handlers
  tags: [geoip]

- name: Enable the geoipupdate timer
  ansible.builtin.systemd:
    name: geoipupdate.timer
    enabled: true
    state: started
  become: true
  tags: [geoip]

- name: Check whether the Country database has been downloaded yet
  ansible.builtin.stat:
    path: "{{ geoip_mmdb_dir }}/GeoLite2-Country.mmdb"
  register: geoip_country_mmdb
  tags: [geoip]

# First run on a new host: fetch the databases now. geoipupdate.service's
# OnSuccess= then runs xt-geoip-build, so the firewall files exist right away.
- name: Run geoipupdate once (first run only)
  ansible.builtin.systemd:
    name: geoipupdate.service
    state: started
  become: true
  when: not geoip_country_mmdb.stat.exists
  tags: [geoip]

# Safety net for a first build that failed or never ran (for example the unit could not
# start before the directory existed): build the country files when they are missing.
- name: Check for built country files
  ansible.builtin.stat:
    path: "{{ geoip_xt_geoip_dir }}/US.iv4"
  register: geoip_country_files
  tags: [geoip]

- name: Check again for the Country database
  ansible.builtin.stat:
    path: "{{ geoip_mmdb_dir }}/GeoLite2-Country.mmdb"
  register: geoip_country_mmdb_now
  tags: [geoip]

- name: Build the xt_geoip country files
  ansible.builtin.command: /usr/local/sbin/xt-geoip-build
  become: true
  changed_when: true
  when:
    - not geoip_country_files.stat.exists
    - geoip_country_mmdb_now.stat.exists
  tags: [geoip]
