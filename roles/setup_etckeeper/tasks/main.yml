---
- name: Install etckeeper
  ansible.builtin.package:
    name: etckeeper
    state: latest
  become: true
  when: ansible_system == 'Linux'

- name: Set git config for etckeeper (actually for user root).
  ansible.builtin.blockinfile:
    path: /root/.gitconfig
    block: |
      [user]
        name = {{ etckeeper_user }}
        email = {{ etckeeper_email }}
    create: true
    mode: '0644'
  become: true
  when: ansible_system == 'Linux'

- name: Run only once checker logic
  ansible.builtin.stat:
    path: /etc/.etckeeper.initmarker
  register: initmarker
  when: ansible_system == 'Linux'

- name: Print etckeeper init check result
  ansible.builtin.debug:
    msg: "Did we run etckeeper already: {{ initmarker.stat.exists }}"
  when: ansible_system == 'Linux' and initmarker is not skipped

- name: Initialize etckeeper
  ansible.builtin.command: /usr/bin/etckeeper init
  args:
    chdir: /etc
  become: true
  when: ansible_system == 'Linux' and not initmarker.stat.exists

# On a host where other roles already ran apt, etckeeper's apt hook has committed /etc, so there can be
# nothing left to commit here; that is fine, only a real git failure should stop the run.
- name: Create etckeeper initial commit
  ansible.builtin.command: /usr/bin/git commit -a -m "Initial commit" # noqa: command-instead-of-module
  args:
    chdir: /etc
  become: true
  register: etckeeper_initial_commit
  when: ansible_system == 'Linux' and not initmarker.stat.exists
  changed_when: etckeeper_initial_commit.rc == 0
  failed_when:
    - etckeeper_initial_commit.rc != 0
    - "'nothing to commit' not in etckeeper_initial_commit.stdout"

- name: Create init marker for etckeeper
  ansible.builtin.file:
    path: /etc/.etckeeper.initmarker
    state: touch
    mode: u=rw,g=r,o=r
  become: true
  when: ansible_system == 'Linux' and not initmarker.stat.exists
