---
# Architecture mapping (shared across repos)
docker_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' if ansible_architecture == 'aarch64' else 'armhf' }}"

# Repo enable/disable flags — set to true in group_vars to activate
apt_repo_docker: false
apt_repo_grafana: false
apt_repo_telegraf: false
apt_repo_charm: false
apt_repo_mise: false
apt_repo_mozilla: false
apt_repo_sury_php: false
apt_repo_gitea: false
apt_repo_duosecurity: false
apt_repo_twilio: false
apt_repo_yarn: false
apt_repo_microsoft: false
apt_repo_nodesource: false

# Docker CE packages
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Firefox packages (apt_repo_mozilla)
mozilla_packages:
  - firefox

# NodeSource (apt_repo_nodesource) — major version line to track, e.g. "24"
nodejs_apt_major_version: "24"
# Purge Debian's own nodejs/npm/libnode packages so NodeSource's package is
# unambiguously the one apt resolves (rather than fighting it with a stronger
# pin) — see role README for why.
nodejs_apt_purge_distro_packages: true
nodejs_apt_distro_conflict_packages:
  - nodejs
  - npm
  - nodejs-doc
  - libnode-dev
