---
- name: Install apt prerequisites
  ansible.builtin.package:
    name:
      - ca-certificates
      - curl
    state: present
  become: true
  tags: [vault]

- name: Download HashiCorp GPG key
  ansible.builtin.get_url:
    url: https://apt.releases.hashicorp.com/gpg
    dest: /etc/apt/keyrings/hashicorp.asc
    mode: "0644"
  become: true
  tags: [vault]

- name: Add HashiCorp apt repository
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/hashicorp.asc] https://apt.releases.hashicorp.com {{ ansible_distribution_release }} main"
    filename: hashicorp
    state: present
  become: true
  tags: [vault]

- name: Install Vault package
  ansible.builtin.package:
    name: "vault{{ ('=' + vault_version) if vault_version else '' }}"
    state: present
    update_cache: true
  become: true
  notify: Restart vault
  tags: [vault]

- name: Create vault storage directory
  ansible.builtin.file:
    path: "{{ vault_storage_path }}"
    state: directory
    owner: vault
    group: vault
    mode: "0700"
  become: true
  tags: [vault]

- name: Deploy vault.hcl
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_config_dir }}/vault.hcl"
    owner: vault
    group: vault
    mode: "0640"
  become: true
  notify: Restart vault
  tags: [vault]

- name: Hold vault at installed version to prevent unintended upgrades
  ansible.builtin.dpkg_selections:
    name: vault
    selection: hold
  become: true
  when: vault_version | length > 0
  tags: [vault]

- name: Enable and start vault
  ansible.builtin.systemd:
    name: vault
    enabled: true
    state: started
    daemon_reload: true
  become: true
  tags: [vault]

- name: Vault initialization reminder
  ansible.builtin.debug:
    msg: |
      Vault is running at http://{{ vault_bind_addr }} (proxied via Apache at {{ vault_api_addr }}).

      On FIRST DEPLOY only — initialize and unseal:
        export VAULT_ADDR=http://127.0.0.1:8200
        vault operator init          # outputs 5 unseal keys + root token — save these securely
        vault operator unseal        # run 3 times with 3 different unseal keys
        vault login <root-token>

      Unseal keys and root token are NOT managed by Ansible.
      Store them in a password manager or offline. Loss = permanent data loss.
  tags: [vault]
