---
# Full recursive resolver — no forwarding. DNSSEC validation always enabled.
# Required for Postfix DANE (smtp_tls_security_level=dane) to work correctly.

# Serve stale data while refreshing (reduces latency on cache expiry)
unbound_prefetch: true

# Cache sizing — msg-cache holds metadata, rrset-cache holds record data (2× ratio is optimal)
unbound_msg_cache_size: 50m
unbound_rrset_cache_size: 100m

# Cache TTL bounds
unbound_cache_min_ttl: 3600
unbound_cache_max_ttl: 86400

# Number of threads — 1 is sufficient for a single-node mail server
unbound_num_threads: 1
