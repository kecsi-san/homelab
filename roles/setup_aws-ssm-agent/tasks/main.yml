---
# No checksum: param — checked 2026-07-26: AWS's own documented Debian install
# process (docs.aws.amazon.com "Manually installing SSM Agent on Debian Server
# instances") is plain wget + dpkg -i with no checksum/signature file published
# alongside this artifact at all, for any region. TLS to s3.<region>.amazonaws.com
# is the only integrity guarantee AWS itself provides here.
- name: Download AWS SSM agent package
  ansible.builtin.get_url:
    url: "{{ aws_ssm_agent_deb_url }}"
    dest: /tmp/amazon-ssm-agent.deb
    mode: "0644"
  become: false
  tags: [ssm]

- name: Install AWS SSM agent package
  ansible.builtin.apt:
    deb: /tmp/amazon-ssm-agent.deb
  become: true
  tags: [ssm]

- name: Enable and start AWS SSM agent
  ansible.builtin.systemd:
    name: amazon-ssm-agent
    enabled: true
    state: started
  become: true
  tags: [ssm]
