---
# Gated off by default: the role changes live mail routing, so each play opts in explicitly.
postfix_smarthost_enabled: false

# The relay. Amazon SES in the same region as the mail server by default.
postfix_smarthost_relay_host: "email-smtp.eu-west-1.amazonaws.com"
postfix_smarthost_relay_port: 587

# Credentials: no defaults on purpose (the role fails early when they are empty).
# For SES these are the SMTP username (the IAM access key id) and the SMTP password
# derived from the secret key, kept in Vault (ec2/ses-relay), see docs/howtos/ses-relay.md.
postfix_smarthost_username: ""
postfix_smarthost_password: ""

# Recipient domains that go through the relay; every other domain is delivered directly.
# The default is the Microsoft consumer list generated by scripts/ms-consumer-domains.sh.
postfix_smarthost_domains: >-
  {{ lookup('ansible.builtin.file', 'microsoft-consumer-domains.txt').splitlines()
     | reject('match', '^\s*(#|$)') | map('trim') | list }}

# TLS to the relay: "verify" checks the certificate chain and host name, "encrypt" only
# requires TLS. Keep "verify" unless the system CA store is unavailable.
postfix_smarthost_tls_level: verify

# CA bundle used to verify the relay's certificate. It is set as smtp_tls_CAfile only when the host
# has neither smtp_tls_CAfile nor smtp_tls_CApath configured (the live EC2 mail server has neither).
postfix_smarthost_ca_file: /etc/ssl/certs/ca-certificates.crt

# Directory for the map files. Postfix reads maps from here on every distribution.
postfix_smarthost_dir: /etc/postfix
