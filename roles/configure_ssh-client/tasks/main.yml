---
- name: Load this machine's SSH host list from Vault
  ansible.builtin.set_fact:
    ssh_client_hosts: >-
      {{
        lookup('community.hashi_vault.vault_kv2_get',
               'ssh-config/' ~ ssh_client_machine_name,
               **vault_workstation_lookup_args)['secret']['hosts']
      }}

- name: Ensure ~/.ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

# key_scope: host   -> workstation/ssh-keys/hosts/<machine>/<key_name>, strictly this machine's own
# key_scope: generic (default, or omitted) -> workstation/ssh-keys/generic/<key_name>, shared pool
- name: Fetch and write each key referenced by this machine's config
  ansible.builtin.copy:
    content: >-
      {{
        lookup('community.hashi_vault.vault_kv2_get',
               'ssh-keys/hosts/' ~ ssh_client_machine_name ~ '/' ~ item.key_name
               if (item.key_scope | default('generic')) == 'host'
               else 'ssh-keys/generic/' ~ item.key_name,
               **vault_workstation_lookup_args)['secret']['private_key']
      }}
    dest: "{{ ansible_env.HOME }}/.ssh/{{ item.key_name }}"
    mode: "0600"
  loop: "{{ ssh_client_hosts }}"
  loop_control:
    label: "{{ item.key_name }}"
  no_log: true

# Public keys aren't secret and are deterministically derivable from the private
# key, so this derives them locally instead of storing/fetching them from Vault
# too. Used for e.g. git commit signing (user.signingkey wants a public key path).
- name: Derive each key's public counterpart
  ansible.builtin.command:
    cmd: "ssh-keygen -y -f {{ ansible_env.HOME }}/.ssh/{{ item.key_name }}"
  loop: "{{ ssh_client_hosts }}"
  loop_control:
    label: "{{ item.key_name }}"
  register: ssh_client_pubkeys
  changed_when: false

- name: Write public key files
  ansible.builtin.copy:
    content: "{{ item.stdout }}\n"
    dest: "{{ ansible_env.HOME }}/.ssh/{{ item.item.key_name }}.pub"
    mode: "0644"
  loop: "{{ ssh_client_pubkeys.results }}"
  loop_control:
    label: "{{ item.item.key_name }}"

- name: Template ~/.ssh/config from the Vault-sourced host list
  ansible.builtin.template:
    src: ssh_config.j2
    dest: "{{ ansible_env.HOME }}/.ssh/config"
    mode: "0600"
