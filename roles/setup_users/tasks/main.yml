---
- name: Create system users
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    comment: "{{ item.comment | default(omit) }}"
    groups: "{{ (item.groups | default([])) + (['sudo'] if item.sudo | default(false) else []) }}"
    append: true
    shell: "{{ item.shell | default('/bin/bash') }}"
    # item.password is plaintext (stored that way in Vault deliberately — SSH access
    # is key-only/password auth disabled, so this only gates PAM-based email login
    # over SSL, and being able to recover a forgotten password from Vault matters
    # more here than defense-in-depth against a leak). Hashed here, on the wire to
    # the target only, never written to disk as plaintext; '!' (locked) if unset.
    password: "{{ item.password | password_hash('sha512') if item.password is defined else '!' }}"
    create_home: true
    state: present
  become: true
  loop: "{{ ec2_users }}"
  no_log: true
  tags:
    - users

- name: Set authorized SSH keys
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_key }}"
    state: present
    exclusive: false
  become: true
  loop: "{{ ec2_users }}"
  when: item.ssh_key is defined
  no_log: true
  tags:
    - users

- name: Remove absent users (home directory preserved for data migration)
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: false
  become: true
  loop: "{{ ec2_users_absent }}"
  tags:
    - users
