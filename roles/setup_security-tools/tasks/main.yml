---
# APT-based security tools (Linux only)
- name: Install security tools via APT
  ansible.builtin.package:
    name: "{{ security_apt_packages }}"
    state: present
  become: true
  when: security_tools_enabled and ansible_system == 'Linux'

# AIDE — exclude Kubernetes' own dynamic storage backends (containerd, kubelet,
# Longhorn) from the catch-all / 0 Full scan rule; without this, aideinit never
# finishes cleanly on kube nodes (tens of GB of constantly-churning data).
# Harmless no-op on hosts without these paths (workstations, the EC2 host).
- name: Deploy AIDE exclusions for Kubernetes dynamic storage paths
  ansible.builtin.copy:
    src: 50_aide_kubernetes
    dest: /etc/aide/aide.conf.d/50_aide_kubernetes
    owner: root
    group: root
    mode: '0644'
  become: true
  when: security_tools_enabled and ansible_system == 'Linux' and 'aide' in security_apt_packages

# AIDE — exclude the NFS backup mount (restic REST server repos) from the
# catch-all / 0 Full scan rule; same rationale as the Kubernetes exclusion
# above. Harmless no-op on hosts without /backups (only hppd600g6 has it).
- name: Deploy AIDE exclusion for NFS backup mount
  ansible.builtin.copy:
    src: 50_aide_backups
    dest: /etc/aide/aide.conf.d/50_aide_backups
    owner: root
    group: root
    mode: '0644'
  become: true
  when: security_tools_enabled and ansible_system == 'Linux' and 'aide' in security_apt_packages

# AIDE — suppress mail reports. dailyaidecheck tries to email its report via
# mail(1), which fails from the systemd service context on hosts with no MTA
# configured (none of ours have one — ntfy is this repo's alerting channel),
# causing the wrapper script to exit 1 regardless of whether AIDE found
# anything. The scan itself still runs and logs; only the (undeliverable)
# e-mail is suppressed.
- name: Suppress AIDE mail reports (no MTA configured on these hosts)
  ansible.builtin.lineinfile:
    path: /etc/default/aide
    regexp: '^SILENTREPORTS='
    line: 'SILENTREPORTS=yes'
  become: true
  when: security_tools_enabled and ansible_system == 'Linux' and 'aide' in security_apt_packages

# AIDE — initialize baseline database if not yet created. Polled (not fire-and-
# forget) so a failed/hung run actually surfaces instead of silently vanishing —
# this ran unbounded in the background for weeks on 3 nodes and never finished.
- name: Initialize AIDE database
  ansible.builtin.command:
    cmd: aideinit -y
    creates: /var/lib/aide/aide.db
  become: true
  when: security_tools_enabled and ansible_system == 'Linux' and 'aide' in security_apt_packages
  async: 1800
  poll: 30

# AIDE teardown — removed from security_apt_packages after dailyaidecheck.timer's
# daily full-filesystem hash (sha256 over every file) cost 15+ min CPU and a ~20G
# memory peak on every kube node. Tears down a previously-installed instance;
# idempotent no-op on hosts that never had it.
- name: Stop and disable AIDE daily check timer
  ansible.builtin.systemd:
    name: dailyaidecheck.timer
    state: stopped
    enabled: false
  become: true
  when: security_tools_enabled and ansible_system == 'Linux' and 'aide' not in security_apt_packages
  ignore_errors: true  # unit doesn't exist on hosts that never had aide installed

- name: Purge AIDE package
  ansible.builtin.apt:
    name:
      - aide
      - aide-common
    state: absent
    purge: true
  become: true
  when: security_tools_enabled and ansible_system == 'Linux' and 'aide' not in security_apt_packages

- name: Remove AIDE config fragments and database
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/aide/aide.conf.d/50_aide_kubernetes
    - /etc/aide/aide.conf.d/50_aide_backups
    - /var/lib/aide
  become: true
  when: security_tools_enabled and ansible_system == 'Linux' and 'aide' not in security_apt_packages

# Lynis — via Cisofy official apt repo (Linux only)
- name: Download Cisofy GPG key
  ansible.builtin.get_url:
    url: https://packages.cisofy.com/keys/cisofy-software-public.key
    dest: /tmp/cisofy-software-public.key
    mode: '0644'
  become: false
  when: security_tools_enabled and ansible_system == 'Linux'

- name: Import Cisofy GPG key
  ansible.builtin.shell:
    cmd: gpg --dearmor < /tmp/cisofy-software-public.key > /etc/apt/keyrings/cisofy-software.gpg
    creates: /etc/apt/keyrings/cisofy-software.gpg
  become: true
  when: security_tools_enabled and ansible_system == 'Linux'

- name: Add Cisofy apt repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/cisofy-software.gpg] https://packages.cisofy.com/community/lynis/deb/ stable main"
    filename: cisofy-lynis
    state: present
  become: true
  when: security_tools_enabled and ansible_system == 'Linux'

- name: Install lynis from Cisofy repo
  ansible.builtin.package:
    name: lynis
    state: present
    update_cache: true
  become: true
  when: security_tools_enabled and ansible_system == 'Linux'

# Trivy — via Homebrew (cross-platform)
- name: Install trivy via Homebrew
  community.general.homebrew:
    name: trivy
    state: present
  become: false
  when: security_tools_enabled

# Hadolint — Dockerfile linter, via Homebrew (cross-platform)
- name: Install hadolint via Homebrew
  community.general.homebrew:
    name: hadolint
    state: present
  become: false
  when: security_tools_enabled
