---
- name: Install eza (ls replacement used by the ls/ll/l/la aliases)
  community.general.homebrew:
    name: eza
    state: present
  become: false

- name: Install libnotify-bin (notify-send, used by the alert alias)
  ansible.builtin.package:
    name: libnotify-bin
    state: present
  become: true
  when: ansible_system == 'Linux'

- name: Deploy ~/.bash_aliases
  ansible.builtin.template:
    src: bash_aliases.j2
    dest: "{{ ansible_env.HOME }}/.bash_aliases"
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"
    mode: '0644'
  become: false
