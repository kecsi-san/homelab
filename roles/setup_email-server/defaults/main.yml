---
email_server_enabled: true

# Primary mail hostname — used for SMTP banner, Dovecot
mail_hostname: "mail.{{ email_domains | first }}"

# Let's Encrypt cert directory name — defaults to mail_hostname but can be overridden
# when using a wildcard cert issued for a parent domain (e.g. linuxbox.hu covers mail.linuxbox.hu)
mail_cert_name: "{{ mail_hostname }}"

# DKIM selector — change to rotate keys (old selector stays valid until DNS TTL expires)
dkim_selector: mail

# Rspamd DKIM key directory
rspamd_dkim_key_dir: /var/lib/rspamd/dkim

# Certbot Let's Encrypt registration email (falls back to acme_email from secrets.yml)
certbot_email: "{{ acme_email }}"

# Postscreen DNSBL sites and scoring threshold.
# Format: "hostname*weight" — total weight must reach threshold to trigger action.
# Spamhaus free DNSBL requires a licence for cloud/datacenter IPs; replace with DQS key if available.
# dnswl.org whitelist entries use negative weights to counterbalance.
# Confirmed dead DNSBLs excluded: dnsbl.sorbs.net (NXDOMAIN), dsn.rfc-ignorant.org (NXDOMAIN).
postscreen_dnsbl_sites:
  - "zen.spamhaus.org=127.0.0.[2..11]*3"
  - "bl.mailspike.net=127.0.0.[2;14;13;12;11;10]"
  - "b.barracudacentral.org*2"
  - "bl.spameatingmonkey.net=127.0.0.2"
  - "psbl.surriel.com"
  - "list.dnswl.org=127.0.[0..255].0*-2"
  - "list.dnswl.org=127.0.[0..255].1*-3"
  - "list.dnswl.org=127.0.[0..255].[2..3]*-4"
postscreen_dnsbl_threshold: 3
postscreen_dnsbl_whitelist_threshold: -1

# System aliases
aliases_root: root        # who receives root's mail — override in host_vars
extra_aliases: {}         # e.g. {fail2ban: kecsi, wiki: kecsi}

# Mail users — defines the virtual address map (user@domain → local system user).
# System users must already exist on the host (created by another role or manually).
# Define in inventory/host_vars — no passwords needed here.
# Format:
#   - name: kecsi           # local system username
#     domains:
#       - kecskemethy.hu
#       - kecskemethy.com
mailbox_users: []
