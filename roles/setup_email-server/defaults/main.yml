---
email_server_enabled: true

# Primary mail hostname — used for SMTP banner, Dovecot
mail_hostname: "mail.{{ email_domains | first }}"

# Let's Encrypt cert directory name — defaults to mail_hostname but can be overridden
# when using a wildcard cert issued for a parent domain (e.g. linuxbox.hu covers mail.linuxbox.hu)
mail_cert_name: "{{ mail_hostname }}"

# DKIM selector — change to rotate keys (old selector stays valid until DNS TTL expires)
dkim_selector: mail

# Rspamd DKIM key directory
rspamd_dkim_key_dir: /var/lib/rspamd/dkim

# Headers Rspamd adds to inbound mail. Debian's package adds none (use = []), so without this the
# scoring has no visible effect and Sieve rules that test the spam header never match.
# spam-header sets <rspamd_spam_header>: Yes when the action is add header or worse; x-spamd-result
# lists the symbols and scores that decided. Mail from local networks and authenticated users is
# skipped by Rspamd's own defaults.
rspamd_milter_headers_use:
  - spam-header
  - x-spamd-result
rspamd_spam_header: X-Spam

# Postscreen DNSBL sites and scoring threshold.
# Format: "hostname*weight" — total weight must reach threshold to trigger action.
# Spamhaus free DNSBL requires a licence for cloud/datacenter IPs; replace with DQS key if available.
# dnswl.org whitelist entries use negative weights to counterbalance.
# Confirmed dead DNSBLs excluded: dnsbl.sorbs.net (NXDOMAIN), dsn.rfc-ignorant.org (NXDOMAIN).
postscreen_dnsbl_sites:
  - "zen.spamhaus.org=127.0.0.[2..11]*3"
  - "bl.mailspike.net=127.0.0.[2;14;13;12;11;10]"
  - "b.barracudacentral.org*2"
  - "bl.spameatingmonkey.net=127.0.0.2"
  - "psbl.surriel.com"
  - "list.dnswl.org=127.0.[0..255].0*-2"
  - "list.dnswl.org=127.0.[0..255].1*-3"
  - "list.dnswl.org=127.0.[0..255].[2..3]*-4"
postscreen_dnsbl_threshold: 3
postscreen_dnsbl_whitelist_threshold: -1

# System aliases
aliases_root: root        # who receives root's mail — override in host_vars
extra_aliases: {}         # e.g. {fail2ban: kecsi, wiki: kecsi}

# Mail users — defines the virtual address map (user@domain → local system user).
# System users must already exist on the host (created by another role or manually).
# Define in inventory/host_vars — no passwords needed here.
# Format:
#   - name: kecsi           # local system username
#     domains:
#       - kecskemethy.hu
#       - kecskemethy.com
mailbox_users: []

# Extra address lines for the virtual map, verbatim: {"address": "target1, target2"}. For what
# mailbox_users cannot express: forwards to outside addresses, several targets, catch-alls
# ("@example.com"), address to address.
mail_virtual_entries: {}
# Extra names accepted as local domains next to email_domains and mail.<domain>, for example
# ["www.example.com"] when mail is addressed to that name.
mail_extra_destinations: []
# HELO/EHLO hostnames to accept even though they don't resolve in public DNS
# (bypasses reject_invalid/non_fqdn/unknown_helo_hostname for these entries only —
# everything else, including postscreen/rspamd/recipient checks, still applies).
# For trusted internal hosts (LAN-only .local names) that deliver system mail
# (cron, fail2ban) to a local mailbox on this server — not a relay/auth substitute,
# see roles/setup_email-server/README.md.
# Format: {"host.internal.example": "OK"}
postfix_helo_access_entries: {}

# --- TLS certificate ---
# Default: a Let's Encrypt certificate under certbot_cert_dir/<mail_cert_name>/ (issued by
# another role). Set mail_tls_supplied: true to install a certificate you bought instead:
# pass the PEM text (leaf followed by the chain) and the private key, for example from Vault.
# Renewal is then manual: replace the values and rerun the role.
mail_tls_supplied: false
mail_tls_dir: /etc/ssl/mail
mail_tls_fullchain_pem: ""
mail_tls_key_pem: ""
mail_tls_cert_file: "{{ (mail_tls_dir ~ '/fullchain.pem') if mail_tls_supplied | bool else (certbot_cert_dir ~ '/' ~ mail_cert_name ~ '/fullchain.pem') }}"
mail_tls_key_file: "{{ (mail_tls_dir ~ '/privkey.pem') if mail_tls_supplied | bool else (certbot_cert_dir ~ '/' ~ mail_cert_name ~ '/privkey.pem') }}"
# Enable the certbot renewal timer and the reload hook (only useful with Let's Encrypt).
mail_certbot_enabled: true

# --- DKIM ---
# Domains and host names that get a DKIM key. Defaults to email_domains; add sender names
# that are not mail domains (for example www.example.com or mail.example.com).
dkim_domains: "{{ email_domains }}"
# Per-domain selectors when they differ from dkim_selector, for example keys carried over
# from another server: {example.com: default, example.org: selector1}.
dkim_domain_selectors: {}
# Private keys to install (PEM text per domain), for example read from Vault. A key is
# written to <rspamd_dkim_key_dir>/<domain>.<selector>.key when it is given here.
dkim_private_keys: {}
# Mirror the on-disk keys into Vault (private) and publish the public halves for a
# Terraform-managed DNS record. Turn off when keys are managed elsewhere.
dkim_vault_sync: true

# --- Postfix network settings ---
# Networks allowed to relay without authentication. Empty = do not set mynetworks
# (Postfix then uses its own default: the host's subnet).
mail_mynetworks: []
# Upstream filters or relays that deliver inbound mail to this server (addresses or
# CIDRs). They skip postscreen tests, Rspamd looks past them to the real sender, and
# OpenDMARC does not judge mail they relay (SPF would always fail for their address).
mail_trusted_relays: []

# --- Sieve (server-side mail filtering, replaces procmail) ---
email_sieve_enabled: false
# Per-user scripts: {username: "script text"}; written to the user's ~/.dovecot.sieve after
# a syntax check (sievec). The users must exist.
email_sieve_user_scripts: {}

# Mail archive (Piler or any SMTP-fed archive). With piler_archive_enabled every message gets a hidden
# copy (always_bcc) to piler_archive_address, and a transport map sends that domain straight to the
# archive's SMTP port. If the archive is down the copy is deferred and retried; no mail is lost.
piler_archive_enabled: false
piler_archive_address: ""        # required when enabled, for example archive@archive.example.com
piler_archive_smtp_host: 127.0.0.1
piler_archive_smtp_port: 2525
