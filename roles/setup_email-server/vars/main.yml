---
email_apt_packages:
  - postfix
  - postfix-pcre
  - dovecot-core
  - dovecot-imapd
  - dovecot-lmtpd
  - dovecot-fts-xapian
  - rspamd
  - opendmarc
  - certbot
  # DNS plugin for automated cert renewal — add when .hu domains move to a supported provider.
  # Cloudflare (free, python3-certbot-dns-cloudflare) is the likely target;
  # Route53 can host .hu zones but cannot register them and charges per zone.
  # - python3-certbot-dns-cloudflare

postfix_config_dir: /etc/postfix
dovecot_config_dir: /etc/dovecot
certbot_cert_dir: /etc/letsencrypt/live
