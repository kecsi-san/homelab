---
# No cert-issuance task here by design: mail_cert_name (e.g. linuxbox.hu) is one
# of setup_apache2's apache_certs domains, and that role already issues a cert
# covering it (webroot/HTTP-01, since linuxbox.hu/kecskemethy.hu aren't
# Route53-hosted zones — only kecskemethy.com/.net are, so --dns-route53 would
# fail here regardless). Requires ec2-web.yml to run before ec2-mail.yml so the
# cert already exists under {{ certbot_cert_dir }}/{{ mail_cert_name }}/ by the
# time Postfix/Dovecot start. Do not add a second, independent issuance task
# for the same domain here — see docs/howtos/ec2-rebuild-plan.md's Phase 6 notes.

- name: Install certbot renewal systemd timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
  become: true
  tags:
    - certbot

- name: Add Postfix and Dovecot to certbot renewal hooks
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-mail.sh
    mode: "0750"
    content: |
      #!/bin/sh
      systemctl reload postfix
      systemctl reload dovecot
  become: true
  tags:
    - certbot
