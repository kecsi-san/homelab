---
- name: Deploy opendmarc.conf
  ansible.builtin.template:
    src: opendmarc.conf.j2
    dest: /etc/opendmarc.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload opendmarc
  tags:
    - opendmarc

- name: Ensure opendmarc is enabled and running
  ansible.builtin.systemd:
    name: opendmarc
    enabled: true
    state: started
  become: true
  tags:
    - opendmarc
