---
- name: Install rspamd
  ansible.builtin.package:
    name: rspamd
    state: present
  become: true
  tags:
    - rspamd

- name: Create DKIM key directory
  ansible.builtin.file:
    path: "{{ rspamd_dkim_key_dir }}"
    state: directory
    owner: _rspamd
    group: _rspamd
    mode: "0700"
  become: true
  tags:
    - rspamd

# Creates both the private key file and a .txt file with the DNS TXT record.
# Idempotent: skipped if the .key already exists (covers fresh install).
# For keys migrated from the old server: copy the .key file first; this task
# is then skipped but a .txt file won't exist — see the display task below.
# Keys carried over from another server (dkim_private_keys, for example from Vault) are
# written first, so the generate task below skips those domains.
- name: Install supplied DKIM private keys
  ansible.builtin.copy:
    dest: "{{ rspamd_dkim_key_dir }}/{{ item }}.{{ dkim_domain_selectors[item] | default(dkim_selector) }}.key"
    content: "{{ dkim_private_keys[item] | trim }}\n"
    owner: _rspamd
    group: _rspamd
    mode: "0400"
  become: true
  loop: "{{ dkim_domains | select('in', dkim_private_keys) | list }}"
  no_log: true
  tags:
    - rspamd

- name: Generate DKIM key pair per domain
  ansible.builtin.shell:
    cmd: >
      rspamadm dkim_keygen
      --bits 2048
      -s {{ dkim_domain_selectors[item] | default(dkim_selector) }}
      -d {{ item }}
      -k {{ rspamd_dkim_key_dir }}/{{ item }}.{{ dkim_domain_selectors[item] | default(dkim_selector) }}.key
      > {{ rspamd_dkim_key_dir }}/{{ item }}.{{ dkim_domain_selectors[item] | default(dkim_selector) }}.txt
    creates: "{{ rspamd_dkim_key_dir }}/{{ item }}.{{ dkim_domain_selectors[item] | default(dkim_selector) }}.key"
  become: true
  loop: "{{ dkim_domains }}"
  tags:
    - rspamd
    - dkim-dns

- name: Fix DKIM key ownership
  ansible.builtin.file:
    path: "{{ rspamd_dkim_key_dir }}/{{ item }}.{{ dkim_domain_selectors[item] | default(dkim_selector) }}.key"
    owner: _rspamd
    group: _rspamd
    mode: "0400"
  become: true
  loop: "{{ dkim_domains }}"
  tags:
    - rspamd

- name: Deploy Rspamd DKIM signing config
  ansible.builtin.template:
    src: rspamd-dkim-signing.conf.j2
    dest: /etc/rspamd/local.d/dkim_signing.conf
    owner: root
    group: _rspamd
    mode: "0640"
  become: true
  notify: Reload rspamd
  tags:
    - rspamd

- name: Deploy Rspamd local_addrs for trusted upstream relays
  ansible.builtin.template:
    src: rspamd-options.inc.j2
    dest: /etc/rspamd/local.d/options.inc
    owner: root
    group: _rspamd
    mode: "0640"
  become: true
  notify: Reload rspamd
  when: mail_trusted_relays | length > 0
  tags:
    - rspamd

- name: Deploy Rspamd milter headers (spam flag for Sieve)
  ansible.builtin.template:
    src: rspamd-milter-headers.conf.j2
    dest: /etc/rspamd/local.d/milter_headers.conf
    owner: root
    group: _rspamd
    mode: "0640"
  become: true
  notify: Reload rspamd
  when: rspamd_milter_headers_use | length > 0
  tags:
    - rspamd

- name: Deploy Rspamd rbl config (switch off listed blocklists)
  ansible.builtin.template:
    src: rspamd-rbl.conf.j2
    dest: /etc/rspamd/local.d/rbl.conf
    owner: root
    group: _rspamd
    mode: "0640"
  become: true
  notify: Reload rspamd
  when: rspamd_disabled_rbls | length > 0
  tags:
    - rspamd

- name: Ensure rspamd is enabled and running
  ansible.builtin.systemd:
    name: rspamd
    enabled: true
    state: started
  become: true
  tags:
    - rspamd

# Derived from the private key on disk rather than the .txt sidecar file,
# which isn't guaranteed to exist for keys migrated from the old server.
- name: Read DKIM private key content
  ansible.builtin.slurp:
    src: "{{ rspamd_dkim_key_dir }}/{{ item }}.{{ dkim_domain_selectors[item] | default(dkim_selector) }}.key"
  become: true
  loop: "{{ dkim_domains }}"
  register: dkim_private_key_files
  when: dkim_vault_sync | bool
  tags:
    - rspamd
    - dkim-dns

- name: Derive DKIM public key (base64 DER) from private key
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      openssl rsa
      -in {{ rspamd_dkim_key_dir }}/{{ item }}.{{ dkim_domain_selectors[item] | default(dkim_selector) }}.key
      -pubout -outform DER 2>/dev/null | openssl base64 -A
    executable: /bin/bash
  become: true
  loop: "{{ dkim_domains }}"
  register: dkim_public_key_b64
  changed_when: false
  check_mode: false
  when: dkim_vault_sync | bool
  tags:
    - rspamd
    - dkim-dns

# Vault is a disaster-recovery backup of the on-disk key, not read by Terraform
# — Terraform only reads dkim-public/* (see terraform/aws/main.tf), keeping
# the private half out of Terraform state. Runs unconditionally every play
# since Vault mirrors current disk state rather than acting as its source.
- name: Back up DKIM private key to Vault
  community.hashi_vault.vault_kv2_write:
    url: "{{ vault_ec2_lookup_args.url }}"
    engine_mount_point: "{{ vault_ec2_lookup_args.engine_mount_point }}"
    auth_method: "{{ vault_ec2_lookup_args.auth_method }}"
    role_id: "{{ vault_ec2_lookup_args.role_id }}"
    secret_id: "{{ vault_ec2_lookup_args.secret_id }}"
    path: "dkim-private/{{ item.item }}"
    data:
      private_key: "{{ item.content | b64decode }}"
  loop: "{{ dkim_private_key_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false
  when: dkim_vault_sync | bool
  tags:
    - rspamd
    - dkim-dns

# Chunked into <=255-byte segments, joined with an embedded '" "' separator
# (not wrapped in quotes at the start/end) — aws_route53_record.records
# auto-wraps each list element in one outer quote pair, so a value already
# bookended in quotes here would double up into an invalid `""..."" `
# string. This is the format Route53 requires for multi-part TXT values.
# noqa suppression below: ansible-lint's static jinja check mis-evaluates
# `item` inside task-level vars, reporting a false "list + str" TypeError;
# verified correct at actual runtime with realistic input.
- name: Publish DKIM public key to Vault (read by Terraform for the Route53 record)
  vars:
    _chunks: "{{ item.stdout | list | batch(220) | map('join') | list }}"
    _txt_value: "{{ (['v=DKIM1; h=sha256; k=rsa; p=' + _chunks[0]] + _chunks[1:]) | join('\" \"') }}" # noqa: jinja[invalid]
  community.hashi_vault.vault_kv2_write:
    url: "{{ vault_ec2_lookup_args.url }}"
    engine_mount_point: "{{ vault_ec2_lookup_args.engine_mount_point }}"
    auth_method: "{{ vault_ec2_lookup_args.auth_method }}"
    role_id: "{{ vault_ec2_lookup_args.role_id }}"
    secret_id: "{{ vault_ec2_lookup_args.secret_id }}"
    path: "dkim-public/{{ item.item }}"
    data:
      public_key: "{{ _txt_value }}"
  loop: "{{ dkim_public_key_b64.results }}"
  loop_control:
    label: "{{ item.item }}"
  delegate_to: localhost
  become: false
  when: dkim_vault_sync | bool
  tags:
    - rspamd
    - dkim-dns
