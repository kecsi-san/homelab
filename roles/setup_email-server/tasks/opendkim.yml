---
- name: Create opendkim keys directory
  ansible.builtin.file:
    path: "{{ opendkim_keys_dir }}/{{ item }}"
    state: directory
    owner: opendkim
    group: opendkim
    mode: "0700"
  become: true
  loop: "{{ email_domains }}"
  tags:
    - opendkim

- name: Generate DKIM key pair per domain (skipped if key already exists)
  ansible.builtin.command:
    cmd: >
      opendkim-genkey
      --directory={{ opendkim_keys_dir }}/{{ item }}
      --domain={{ item }}
      --selector={{ dkim_selector }}
      --bits=2048
    creates: "{{ opendkim_keys_dir }}/{{ item }}/{{ dkim_selector }}.private"
  become: true
  loop: "{{ email_domains }}"
  tags:
    - opendkim

- name: Set key ownership
  ansible.builtin.file:
    path: "{{ opendkim_keys_dir }}/{{ item }}/{{ dkim_selector }}.private"
    owner: opendkim
    group: opendkim
    mode: "0600"
  become: true
  loop: "{{ email_domains }}"
  tags:
    - opendkim

- name: Deploy opendkim.conf
  ansible.builtin.template:
    src: opendkim.conf.j2
    dest: "{{ opendkim_config_dir }}/opendkim.conf"
    owner: root
    group: opendkim
    mode: "0640"
  become: true
  notify: Reload opendkim
  tags:
    - opendkim

- name: Deploy KeyTable
  ansible.builtin.template:
    src: opendkim-keytable.j2
    dest: "{{ opendkim_config_dir }}/KeyTable"
    owner: root
    group: opendkim
    mode: "0640"
  become: true
  notify: Reload opendkim
  tags:
    - opendkim

- name: Deploy SigningTable
  ansible.builtin.template:
    src: opendkim-signingtable.j2
    dest: "{{ opendkim_config_dir }}/SigningTable"
    owner: root
    group: opendkim
    mode: "0640"
  become: true
  notify: Reload opendkim
  tags:
    - opendkim

- name: Ensure opendkim is enabled and running
  ansible.builtin.systemd:
    name: opendkim
    enabled: true
    state: started
  become: true
  tags:
    - opendkim

- name: Print DKIM public keys for DNS (add to Route53 as TXT records)
  ansible.builtin.command:
    cmd: cat {{ opendkim_keys_dir }}/{{ item }}/{{ dkim_selector }}.txt
  become: true
  loop: "{{ email_domains }}"
  register: dkim_public_keys
  changed_when: false
  tags:
    - opendkim
    - dkim-dns

- name: Show DKIM public keys
  ansible.builtin.debug:
    msg: |
      === DKIM TXT record for {{ item.item }} ===
      Name:  {{ dkim_selector }}._domainkey.{{ item.item }}
      Value: {{ item.stdout }}
  loop: "{{ dkim_public_keys.results }}"
  tags:
    - opendkim
    - dkim-dns
