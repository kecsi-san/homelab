---
- name: Deploy dovecot.conf
  ansible.builtin.template:
    src: dovecot.conf.j2
    dest: "{{ dovecot_config_dir }}/dovecot.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload dovecot
  tags:
    - dovecot

- name: Deploy dovecot SSL config
  ansible.builtin.template:
    src: dovecot-ssl.conf.j2
    dest: "{{ dovecot_config_dir }}/conf.d/10-ssl.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload dovecot
  tags:
    - dovecot

- name: Deploy dovecot FTS config
  ansible.builtin.template:
    src: dovecot-fts.conf.j2
    dest: "{{ dovecot_config_dir }}/conf.d/90-fts.conf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload dovecot
  tags:
    - dovecot
    - fts

- name: Deploy Dovecot FTS maintenance cron job
  ansible.builtin.cron:
    name: dovecot-fts-maintenance
    minute: "0"
    hour: "4"
    job: >-
      for dir in /home/*/Maildir/xapian-indexes; do
      [ -d "$dir" ] || continue;
      u=$(stat -c '\%U' "$dir");
      /usr/bin/doveadm fts optimize -u "$u" 2>&1 | logger -t dovecot-fts-optimize;
      done
    user: root
    cron_file: dovecot-fts
  become: true
  tags:
    - dovecot
    - fts

- name: Ensure dovecot is enabled and running
  ansible.builtin.systemd:
    name: dovecot
    enabled: true
    state: started
  become: true
  tags:
    - dovecot
