---
- name: Check the mail archive address
  ansible.builtin.assert:
    that: "'@' in piler_archive_address"
    fail_msg: "piler_archive_enabled needs piler_archive_address (for example archive@archive.example.com)"
    quiet: true
  when: piler_archive_enabled | bool
  tags:
    - postfix

- name: Deploy Postfix main.cf
  ansible.builtin.template:
    src: postfix-main.cf.j2
    dest: "{{ postfix_config_dir }}/main.cf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload postfix
  tags:
    - postfix

- name: Deploy Postfix master.cf
  ansible.builtin.template:
    src: postfix-master.cf.j2
    dest: "{{ postfix_config_dir }}/master.cf"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload postfix
  tags:
    - postfix

- name: Deploy virtual address map
  ansible.builtin.template:
    src: postfix-virtual.j2
    dest: "{{ postfix_config_dir }}/virtual"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Rebuild virtual db
    - Reload postfix
  tags:
    - postfix

- name: Deploy the transport map for the mail archive
  ansible.builtin.template:
    src: postfix-transport.j2
    dest: "{{ postfix_config_dir }}/transport"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Rebuild transport db
    - Reload postfix
  when: piler_archive_enabled | bool
  tags:
    - postfix

- name: Deploy the postscreen allow list for trusted upstream relays
  ansible.builtin.template:
    src: postscreen-access.cidr.j2
    dest: "{{ postfix_config_dir }}/postscreen_access.cidr"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload postfix
  when: mail_trusted_relays | length > 0
  tags:
    - postfix

- name: Deploy Postfix HELO access map
  ansible.builtin.template:
    src: postfix-helo-access.j2
    dest: "{{ postfix_config_dir }}/helo_access"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - Rebuild helo_access db
    - Reload postfix
  tags:
    - postfix

- name: Deploy /etc/aliases
  ansible.builtin.template:
    src: aliases.j2
    dest: /etc/aliases
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Rebuild aliases db
  tags:
    - postfix

- name: Ensure postfix is enabled and running
  ansible.builtin.systemd:
    name: postfix
    enabled: true
    state: started
  become: true
  tags:
    - postfix
