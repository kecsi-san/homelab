---
- name: Configure postgrey options
  ansible.builtin.template:
    src: postgrey-defaults.j2
    dest: /etc/default/postgrey
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart postgrey
  tags:
    - postgrey

- name: Ensure postgrey is enabled and running
  ansible.builtin.systemd:
    name: postgrey
    enabled: true
    state: started
  become: true
  tags:
    - postgrey
