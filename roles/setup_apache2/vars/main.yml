---
apache_apt_packages:
  - apache2
  - libapache2-mod-security2
  - modsecurity-crs
  - libapache2-mod-evasive
  - certbot

# Modules enabled via a2enmod (creates: guard uses .load file — works for all modules)
apache_modules_to_enable:
  - ssl
  - socache_shmcb   # required for SSL session cache and OCSP stapling
  - rewrite
  - proxy
  - proxy_http
  - headers
  - deflate
  - security2
  - evasive
