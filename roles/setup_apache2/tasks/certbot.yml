---
# Install DNS-Route53 plugin only if at least one cert uses that method
- name: Install certbot DNS-Route53 plugin
  ansible.builtin.package:
    name: python3-certbot-dns-route53
    state: present
  become: true
  when: apache_certs | selectattr('method', 'defined') | selectattr('method', 'equalto', 'dns-route53') | list | length > 0
  tags:
    - apache2
    - certbot

# acme-dns credentials + hook script, only if at least one cert uses that method.
# The hook itself (files/acme-dns-auth.py) is the standard, non-secret joohoi/acme-dns
# script — only /etc/letsencrypt/acmedns.json (its account credentials, sourced from
# Vault, never committed) is sensitive.
- name: Deploy acmedns.json (acme-dns account credentials)
  ansible.builtin.copy:
    content: "{{ acme_dns_json }}"
    dest: /etc/letsencrypt/acmedns.json
    owner: root
    group: root
    mode: "0600"
  become: true
  when: apache_certs | selectattr('method', 'defined') | selectattr('method', 'equalto', 'acme-dns') | list | length > 0
  tags:
    - apache2
    - certbot

- name: Deploy acme-dns-auth.py manual-auth-hook script
  ansible.builtin.copy:
    src: acme-dns-auth.py
    dest: /etc/letsencrypt/acme-dns-auth.py
    owner: root
    group: root
    mode: "0700"
  become: true
  when: apache_certs | selectattr('method', 'defined') | selectattr('method', 'equalto', 'acme-dns') | list | length > 0
  tags:
    - apache2
    - certbot

# Webroot dir — serves ACME challenges for all vhosts via the global conf
- name: Create certbot webroot directory
  ansible.builtin.file:
    path: /var/www/letsencrypt/.well-known/acme-challenge
    state: directory
    owner: www-data
    group: www-data
    mode: "0755"
  become: true
  tags:
    - apache2
    - certbot

- name: Deploy ACME challenge global conf
  ansible.builtin.copy:
    dest: /etc/apache2/conf-available/letsencrypt-webroot.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible — serve ACME challenges for all vhosts
      Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
      <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
          Options None
          AllowOverride None
          Require all granted
      </Directory>
  become: true
  notify: Reload apache2
  tags:
    - apache2
    - certbot

- name: Enable ACME challenge conf
  ansible.builtin.command:
    cmd: a2enconf letsencrypt-webroot
    creates: /etc/apache2/conf-enabled/letsencrypt-webroot.conf
  become: true
  notify: Reload apache2
  tags:
    - apache2
    - certbot

# Flush handlers so Apache reloads before certbot tries to validate
- name: Flush handlers before cert issuance
  ansible.builtin.meta: flush_handlers
  tags:
    - certbot

- name: Issue TLS certificates via webroot (HTTP-01)
  ansible.builtin.command:
    cmd: >
      certbot certonly --non-interactive --agree-tos
      --webroot -w /var/www/letsencrypt
      --email {{ certbot_email }}
      -d {{ item.domain }}
      {% for san in item.extra_sans | default([]) %}-d {{ san }} {% endfor %}
    creates: "{{ certbot_cert_dir }}/{{ item.domain }}/fullchain.pem"
  become: true
  loop: >-
    {{ apache_certs | rejectattr('method', 'defined') | list +
       apache_certs | selectattr('method', 'defined') |
       selectattr('method', 'equalto', 'webroot') | list }}
  tags:
    - certbot

- name: Issue TLS certificates via DNS-01 (Route53)
  ansible.builtin.command:
    cmd: >
      certbot certonly --non-interactive --agree-tos
      --dns-route53
      --email {{ certbot_email }}
      -d {{ item.domain }}
      {% for san in item.extra_sans | default([]) %}-d {{ san }} {% endfor %}
    creates: "{{ certbot_cert_dir }}/{{ item.domain }}/fullchain.pem"
  environment:
    AWS_ACCESS_KEY_ID: "{{ aws_access_key_id }}"
    AWS_SECRET_ACCESS_KEY: "{{ aws_secret_access_key }}"
    AWS_DEFAULT_REGION: "{{ aws_region }}"
  become: true
  loop: "{{ apache_certs | selectattr('method', 'defined') | selectattr('method', 'equalto', 'dns-route53') | list }}"
  tags:
    - certbot

# Wildcard (-d domain -d *.domain) via the acme-dns.io delegation service — matches
# the legacy server's proven config exactly for domains with no DNS API access
# (linuxbox.hu, kecskemethy.hu — same ".hu, no API" limitation as the webroot-issued
# certs' comment above, but these use wildcards so extra_sans isn't needed/read here).
# The one-time acme-dns account registration + _acme-challenge CNAME delegation in the
# real DNS zone is a manual step done ahead of time (see roles/setup_apache2/README.md)
# — this task only renews/re-validates using the credentials already in acmedns.json.
- name: Issue wildcard TLS certificates via acme-dns (DNS-01, manual hook)
  ansible.builtin.command:
    cmd: >
      certbot certonly --non-interactive --agree-tos
      --manual --preferred-challenges dns-01
      --manual-auth-hook /etc/letsencrypt/acme-dns-auth.py
      --email {{ certbot_email }}
      -d {{ item.domain }}
      -d *.{{ item.domain }}
    creates: "{{ certbot_cert_dir }}/{{ item.domain }}/fullchain.pem"
  become: true
  loop: "{{ apache_certs | selectattr('method', 'defined') | selectattr('method', 'equalto', 'acme-dns') | list }}"
  tags:
    - certbot

- name: Install certbot renewal systemd timer
  ansible.builtin.systemd:
    name: certbot.timer
    enabled: true
    state: started
  become: true
  tags:
    - certbot

- name: Add Apache2 to certbot renewal deploy hook
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-apache2.sh
    mode: "0750"
    content: |
      #!/bin/sh
      systemctl reload apache2
  become: true
  tags:
    - certbot
