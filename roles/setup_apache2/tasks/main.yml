---
- name: Install Apache2 packages
  ansible.builtin.package:
    name: "{{ apache_apt_packages }}"
    state: present
  become: true
  tags:
    - apache2

- name: Enable Apache modules
  ansible.builtin.command:
    cmd: a2enmod {{ item }}
    creates: /etc/apache2/mods-enabled/{{ item }}.load
  become: true
  loop: "{{ apache_modules_to_enable }}"
  notify: Reload apache2
  tags:
    - apache2

- name: Deploy global security config
  ansible.builtin.template:
    src: security.conf.j2
    dest: /etc/apache2/conf-available/security-hardening.conf
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Reload apache2
  tags:
    - apache2

- name: Enable global security config
  ansible.builtin.command:
    cmd: a2enconf security-hardening
    creates: /etc/apache2/conf-enabled/security-hardening.conf
  become: true
  notify: Reload apache2
  tags:
    - apache2

- name: Issue TLS certificates
  ansible.builtin.import_tasks: certbot.yml

- name: Configure vhosts
  ansible.builtin.import_tasks: vhosts.yml

- name: Ensure apache2 is enabled and running
  ansible.builtin.systemd:
    name: apache2
    enabled: true
    state: started
  become: true
  tags:
    - apache2
