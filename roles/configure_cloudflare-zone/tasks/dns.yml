---
- name: Manage Cloudflare DNS records
  community.general.cloudflare_dns:
    zone: "{{ item.zone }}"
    record: "{{ item.record }}"
    type: "{{ item.type }}"
    value: "{{ item.value }}"
    ttl: "{{ item.ttl | default(3600) }}"
    proxied: "{{ item.proxied | default(false) }}"
    api_token: "{{ cloudflare_api_token }}"
    state: present
  loop: "{{ cloudflare_dns_records }}"
  loop_control:
    label: "{{ item.record }}.{{ item.zone }} ({{ item.type }}) → {{ item.value }}"
