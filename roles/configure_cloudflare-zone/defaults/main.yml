---
# Cloudflare API credentials — set in secrets.yml (gitignored)
# cloudflare_api_token: "your-dns-token"         # needs Zone:DNS:Edit scope
# cloudflare_settings_token: "your-settings-token"  # needs Zone:Settings:Edit scope
#   (if not set separately, falls back to cloudflare_api_token)
# homelab_wan_ip: "your-public-ip"               # WAN IP for direct-access DNS records (not proxied)

cloudflare_settings_token: "{{ cloudflare_api_token }}"

# DNS records managed via community.general.cloudflare_dns
# proxied: false required for UDP services (e.g. game servers)
cloudflare_dns_records:
  - zone: "{{ domain_name }}"
    record: minecraft
    type: A
    value: "{{ homelab_wan_ip }}"
    ttl: 3600
    proxied: false

# Zone settings to enforce
cloudflare_ech_enabled: false
