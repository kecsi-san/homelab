---
git_user_name: "{{ admin_full_name }}"
git_user_email: "{{ admin_email }}"
# SSH-format signing (not GPG) -- reuses the github.com key already deployed
# by configure_ssh-client, which must run before this role. See README.
git_user_signingkey: "{{ ansible_env.HOME }}/.ssh/github.com.pub"
git_user_gpgsign: true
