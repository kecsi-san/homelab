---
- name: Install git-lfs (Linux)
  ansible.builtin.package:
    name: git-lfs
    state: present
  become: true
  when: ansible_system == 'Linux'
  tags:
    - gitconfig
    - git

- name: Install git-lfs (macOS)
  community.general.homebrew:
    name: git-lfs
    state: present
  become: false
  when: ansible_system == 'Darwin'
  tags:
    - gitconfig
    - git

- name: Register git-lfs global filters
  ansible.builtin.command: git lfs install --skip-repo
  become: false
  changed_when: false
  tags:
    - gitconfig
    - git

- name: Deploy gitconfig file
  ansible.builtin.template:
    src: gitconfig.j2
    dest: "{{ ansible_env.HOME }}/.gitconfig"
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"
    mode: '0644'
  become: false
  tags:
    - gitconfig

- name: Deploy allowed_signers file for local SSH-signature verification
  ansible.builtin.copy:
    content: "{{ git_user_email }} {{ lookup('ansible.builtin.file', git_user_signingkey) }}\n"
    dest: "{{ ansible_env.HOME }}/.ssh/allowed_signers"
    owner: "{{ ansible_env.USER }}"
    group: "{{ ansible_env.USER }}"
    mode: '0644'
  become: false
  # Only when signing is actually on (i.e. never on remote k8s-nodes.yml hosts,
  # which override gpgsign to false -- the file lookup above reads from the
  # control node, not the remote target, so it wouldn't resolve correctly there).
  when: git_user_gpgsign | bool
  tags:
    - gitconfig
