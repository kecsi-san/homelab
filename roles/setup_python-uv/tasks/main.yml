---
- name: Load OS specific variables
  ansible.builtin.include_vars: "os/{{ ansible_system }}.yml"

- name: Install uv CLI tools
  ansible.builtin.command:
    argv: >-
      {{ [uv_bin, 'tool', 'install', '--force', '--python', python_version | string,
          item.name + (item.version | default(''))]
        + (item.extras | default([]) | map('regex_replace', '^(.+)$', '--with=\1') | list) }}
  loop: "{{ uv_tools }}"
  loop_control:
    label: "{{ item.name }}"
  become: false
  changed_when: false

- name: Create devops virtualenv
  ansible.builtin.command:
    cmd: "{{ uv_bin }} venv --python {{ python_version }} {{ uv_venv_path }}"
    creates: "{{ uv_venv_path }}/pyvenv.cfg"
  become: false

- name: Install pip packages into devops venv
  ansible.builtin.command:
    cmd: "{{ uv_bin }} pip install {{ uv_pip_packages | join(' ') }}"
  environment:
    VIRTUAL_ENV: "{{ uv_venv_path }}"
  become: false
  changed_when: false
  when: uv_pip_packages | length > 0

- name: Add uv tool bin dir to PATH in ~/.bashrc
  ansible.builtin.blockinfile:
    dest: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: uv tools PATH"
    block: |
      export PATH="{{ ansible_env.HOME }}/.local/bin:$PATH"
  become: false

- name: Add devops venv auto-activation to ~/.bashrc
  ansible.builtin.blockinfile:
    dest: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: devops venv"
    block: |
      source {{ uv_venv_path }}/bin/activate
  become: false
  when: uv_venv_autoactivate

# Optional pyenv-based Python version management
- name: Install pyenv via Homebrew
  community.general.homebrew:
    name: "{{ pyenv_brew_packages }}"
    state: present
  become: false
  when: pyenv_enabled

- name: Add pyenv initialization to ~/.bashrc
  ansible.builtin.blockinfile:
    dest: "{{ ansible_env.HOME }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: pyenv"
    block: |
      export PYENV_ROOT="$HOME/.pyenv"
      export PATH="$PYENV_ROOT/bin:$PATH"
      eval "$(pyenv init -)"
      eval "$(pyenv virtualenv-init -)"
  become: false
  when: pyenv_enabled

# Optional Tkinter bindings, tied to specific Python versions
- name: Install python-tk versions via Homebrew
  community.general.homebrew:
    name: "{{ python_tk_versions }}"
    state: present
  become: false
  when: python_tk_versions | length > 0
