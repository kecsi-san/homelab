---
python_version: 3.12

# Shared virtualenv for library packages (Tier 3 pip packages)
uv_venv_path: "{{ ansible_env.HOME }}/.venv/devops"

# Automatically activate the devops venv in ~/.bashrc
uv_venv_autoactivate: true

# CLI tools installed in isolated environments via `uv tool install`.
uv_tools:
  - name: ansible-core
    version: ">=2.18,<2.19"
    extras:
      - netaddr
      - librouteros
      - hvac
  - name: ansible-lint
  - name: checkov
  - name: git-changelog
  - name: pip-audit
  - name: ruff
  - name: yamllint

# Library packages installed into the shared devops venv via `uv pip install`.
# Activate with: source ~/.venv/devops/bin/activate
uv_pip_packages:
  - atlassian-python-api
  - datadog-api-client
  - diagrams
  - graphviz
  - hvac
  - jira
  - jsonpath-ng
  - lxml
  - markdown2
  - matplotlib
  - nc-py-api
  - openai
  - pyhcl
  - PyJWT
  - PyYAML
  - pyOpenSSL
  - python-jenkins
  - requests-mock
  - setuptools-scm
  - tfparse
  - tinycss2

# Optional pyenv-based Python version management (alongside uv, which only
# manages tool/library isolation, not multiple interpreter versions).
pyenv_enabled: false
pyenv_brew_packages:
  - pyenv
  - pyenv-virtualenv

# Optional Tkinter bindings for specific Python versions (needed for GUI /
# matplotlib Tk backends). Empty by default — populate per Python version
# in use, e.g. ["python-tk@3.12", "python-tk@3.13"].
python_tk_versions: []
