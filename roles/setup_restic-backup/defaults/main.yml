---
# Master switch: playbooks run this role only when true.
restic_backup_enabled: false

# Repository and password. No defaults on purpose: the role fails early when they are
# empty. Set them from Vault. An S3 repository looks like
# s3:s3.amazonaws.com/<bucket>/<prefix>; credentials for S3 come from the instance
# profile, so no AWS keys are needed on EC2.
restic_backup_repository: ""
restic_backup_password: ""

# Directories to back up, one restic snapshot per directory, tagged restic_backup_tag.
restic_backup_dirs:
  - /etc
  - /root
  - /home
restic_backup_tag: fs

# Extra arguments for `restic backup`, for example ["--exclude-caches"].
restic_backup_extra_args: []

# systemd calendar expression and a random delay added on top of it.
restic_backup_schedule: "*-*-* 23:00:00"
restic_backup_random_delay: 15min

# Create the repository when it does not exist yet (restic init). Use one repository per
# host: a small repository keeps the index, and so restic's memory use and cache, small.
restic_backup_init: false
# Repository format for restic init; empty = the restic default. Format 2 (restic 0.14 or
# newer) adds compression; clients older than 0.14 cannot read it.
restic_backup_repo_version: ""

# Weekly maintenance: forget old snapshots, prune, check, clean unused caches. Safe to
# enable on every host when each host has its own repository. With a repository shared by
# several hosts enable it on ONE host only: prune takes an exclusive lock.
restic_backup_maintenance: false
restic_backup_maintenance_schedule: "Sun *-*-* 03:30:00"
restic_backup_keep_daily: 14
restic_backup_keep_weekly: 8
restic_backup_keep_monthly: 12

restic_backup_apt_packages:
  - restic
restic_backup_config_dir: /etc/restic
