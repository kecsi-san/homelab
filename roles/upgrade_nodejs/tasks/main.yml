---
# Upgrades Node.js and its global npm packages, via whichever method
# installed it (see nodejs_install_method, kept in sync with
# setup_nodejs-dev-tools). Companion to setup_nodejs-dev-tools (initial
# install) and upgrade_brew (upgrades the nvm/pnpm Homebrew formulae
# themselves, not the Node.js version nvm manages).

# --- homebrew-nvm method (workstations) ---

- name: Get Homebrew nvm prefix
  ansible.builtin.command: brew --prefix nvm
  register: nvm_brew_prefix
  changed_when: false
  become: false
  when: nodejs_install_method == 'homebrew-nvm'

- name: Upgrade Node.js via nvm (carries over global npm packages)
  ansible.builtin.shell:
    cmd: >
      export NVM_DIR="{{ ansible_env.HOME }}/.nvm";
      . "{{ nvm_brew_prefix.stdout }}/nvm.sh";
      nvm install {{ nodejs_version }} --reinstall-packages-from=current &&
      nvm alias default {{ nodejs_version }} &&
      nvm cache clear
  become: false
  changed_when: true
  when: nodejs_install_method == 'homebrew-nvm'

- name: Upgrade global npm packages
  ansible.builtin.shell:
    cmd: >
      export NVM_DIR="{{ ansible_env.HOME }}/.nvm";
      . "{{ nvm_brew_prefix.stdout }}/nvm.sh";
      npm update -g
  become: false
  changed_when: true
  when: nodejs_install_method == 'homebrew-nvm' and (nodejs_npm_global_packages | length > 0)

# --- apt-nodesource method (servers) ---
# Re-running the NodeSource install with a bumped nodejs_apt_major_version IS
# the upgrade — apt resolves the new major version from the repo. Global npm
# packages are then force-reinstalled (state: latest, not just "present")
# since native addons are ABI-tied to the Node version and must be rebuilt/
# refetched after a major bump, not just left alone.

- name: Upgrade Node.js via NodeSource apt repo
  ansible.builtin.import_role:
    name: setup_apt_repos
  vars:
    apt_repo_nodesource: true
  become: true
  when: nodejs_install_method == 'apt-nodesource'

- name: Reinstall global npm packages for the new Node.js ABI
  community.general.npm:
    name: "{{ item }}"
    global: true
    state: latest
  become: true
  loop: "{{ nodejs_npm_global_packages }}"
  when: nodejs_install_method == 'apt-nodesource' and (nodejs_npm_global_packages | length > 0)
